PDT", "format": "4:5 Feed Post + 9:16 Story • Q3", "title": "Stop Slapping the Trigger: Master Slack Take-Up & Reset", "folder": "weekly-2027/week-28-trigger-reset-and-slack-cadence", "files": [{"path": "weekly-2027/week-28-trigger-reset-and-slack-cadence/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-28-trigger-reset-and-slack-cadence/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/shot-diagnosis.html", "sticker_text": "", "caption": "Stop Slapping the Trigger: Master Slack Take-Up & Reset\n\nਟਰਿੱਗਰ ਨੂੰ ਕਦੇ ਝਟਕੇ ਨਾਲ ਨਾ ਛੱਡੋ — ਰੀਸੈੱਟ ਦੀ 'ਟਿਕ' ਆਵਾਜ਼ ਤੱਕ ਹੀ ਉਂਗਲ ਪਿੱਛੇ ਕਰੋ\n\nSlapping the trigger from full forward travel disturbs sight alignment. Riding the tactile reset cuts trigger travel by up to 60% for smoother follow-through.\n\n• Take Up Initial Slack: Smoothly press through light pre-travel until you feel the crisp 'wall' before firing.\n• Press Straight Through the Wall: Add smooth rearward pressure using the center pad of your index finger.\n• Hold, Then Release to Reset: After firing, ease forward ONLY until you feel/hear the tactile reset click.\n• Practice Safely Dry-Fire: Review all 4 neuromuscular drills at sikhrpa.org/shot-diagnosis.html.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/shot-diagnosis.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #MarksmanshipFundamentals #TriggerControl #PistolFundamentals #DryFireSafety #StaySafeBeResponsible", "notes": "Add a Poll sticker: 'Do you practice feeling the trigger reset during safe dry-fire?' ('Every session!' / 'Starting this week!')"}, {"id": "w2027-29", "badge": "W29", "tab": "y2027", "date": "Tue, Jul 20, 2027", "time": "5:30 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q3", "title": "Does Your Gurdwara Have a Wall-Mounted Bleeding Control Kit?", "folder": "weekly-2027/week-29-gurdwara-bleeding-control-cabinets", "files": [{"path": "weekly-2027/week-29-gurdwara-bleeding-control-cabinets/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-29-gurdwara-bleeding-control-cabinets/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/trauma-safety.html", "sticker_text": "", "caption": "Does Your Gurdwara Have a Wall-Mounted Bleeding Control Kit?\n\nਗੁਰਦੁਆਰਾ ਸਾਹਿਬ ਵਿੱਚ ਐਮਰਜੈਂਸੀ ਬਲੀਡਿੰਗ ਕੰਟਰੋਲ ਕਿੱਟ ਅਤੇ ਸੇਵਾਦਾਰਾਂ ਦੀ ਸਿਖਲਾਈ\n\nJust like AEDs and fire extinguishers, public-access Stop the Bleed wall cabinets save lives during kitchen accidents, parking-lot injuries, or community emergencies.\n\n• Pair Next to Your AED: Mount a clearly labeled Bleeding Control station beside the Gurdwara's AED unit.\n• Train Langar & Security Sevadaars: Equip volunteers with hands-on tourniquet, wound-packing, and 911 dispatch readiness.\n• Bilingual Emergency Cards: Post English & Punjabi step-by-step reference guides inside the cabinet.\n• Free SikhRPA Consultation: Email president@sikhrpa.org — SikhRPA assists California Gurdwara committees at zero cost.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/trauma-safety.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nMedical Disclaimer: Provided strictly for general safety awareness and does not constitute medical advice. Always dial 911 in an emergency and pursue hands-on training through ACS Stop the Bleed® or the Red Cross.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #GurdwaraOutreach #StopTheBleed #CommunityPreparedness #FirstAidEducation #CaliforniaSikhs #StaySafeBeResponsible", "notes": "Share to Story & tag your Gurdwara committee — email president@sikhrpa.org for free trauma-cabinet guidance."}, {"id": "w2027-30", "badge": "W30", "tab": "y2027", "date": "Tue, Jul 27, 2027", "time": "12:00 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q3", "title": "Moved Recently? Fix Your CA DMV Address Before Visiting a Dealer", "folder": "weekly-2027/week-30-address-mismatch-dros-avoidance", "files": [{"path": "weekly-2027/week-30-address-mismatch-dros-avoidance/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-30-address-mismatch-dros-avoidance/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/buyer-guide.html", "sticker_text": "", "caption": "Moved Recently? Fix Your CA DMV Address Before Visiting a Dealer\n\nਨਵੇਂ ਘਰ ਸ਼ਿਫਟ ਹੋਏ ਹੋ? ਡੀਲਰ ਕੋਲ ਜਾਣ ਤੋਂ ਪਹਿਲਾਂ DMV ਪਤਾ ਜ਼ਰੂਰ ਅਪਡੇਟ ਕਰੋ\n\nAn address mismatch between your California Driver's License, DMV record, and handgun Proof of Residency is one of the fastest ways to get delayed or rejected at the counter.\n\n• Update CA DMV Online First: Submit your official change of address in the DMV database well ahead of time.\n• Bring Updated Vehicle Registration: A current DMV registration card showing your new street address satisfies residency proof.\n• Verify Every Character on DROS: Double-check apartment numbers, St vs. Ave, and middle initials before signing.\n• Run Our 5-Item Readiness Audit: Check all paperwork free at sikhrpa.org/buyer-guide.html.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/buyer-guide.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nEducational Disclaimer: Provided exclusively for 501(c)(3) public safety education — not legal advice. Always verify current statutes with the California DOJ Bureau of Firearms or consult a qualified California attorney.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #CaliforniaCompliance #CAFirstTimeGuide #CADOJ #PublicSafetyEducation #StaySafeBeResponsible", "notes": "Add a Link sticker to sikhrpa.org/buyer-guide.html."}, {"id": "w2027-31", "badge": "W31", "tab": "y2027", "date": "Tue, Aug 3, 2027", "time": "5:30 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q3", "title": "50/200-Yard vs. 100-Yard Rifle Zero: Which Should You Choose?", "folder": "weekly-2027/week-31-50-200-vs-100-yard-carbine-zero", "files": [{"path": "weekly-2027/week-31-50-200-vs-100-yard-carbine-zero/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-31-50-200-vs-100-yard-carbine-zero/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/zero-optics.html", "sticker_text": "", "caption": "50/200-Yard vs. 100-Yard Rifle Zero: Which Should You Choose?\n\nਕਾਰਬਾਈਨ ਜ਼ੀਰੋਇੰਗ ਤੁਲਨਾ — 50/200 ਗਜ਼ ਬਨਾਮ 100 ਗਜ਼ ਜ਼ੀਰੋ ਦਾ ਫ਼ਰਕ\n\nUnderstanding where your bullet crosses your optical line of sight eliminates guesswork from close quarters out to 200+ yards.\n\n• 50/200-Yard Practical Zero: Crosses line of sight at 50 yd, rises <2\" at ~120 yd, and crosses zero again at 200 yd.\n• 100-Yard Precision Zero: Preferred for magnified scopes — trajectory kisses crosshair at 100 yd and drops smoothly after.\n• Account for 2.6\" Height-Over-Bore: On either zero, close 3–7 yard shots still hit ~1.5\"–2.5\" below the dot.\n• Interactive Click Calculator: Plot your 5-shot group free at sikhrpa.org/zero-optics.html.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/zero-optics.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #OpticsZeroing #BallisticsEducation #MarksmanshipFundamentals #RangeSafety #StaySafeBeResponsible", "notes": "Add a Poll sticker: 'Which carbine zero do you prefer?' ('50/200 Yard' / '100 Yard') + Link to sikhrpa.org/zero-optics.html."}, {"id": "w2027-32", "badge": "W32", "tab": "y2027", "date": "Tue, Aug 10, 2027", "time": "12:00 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q3", "title": "Back-to-School Safety: Asking About Safe Storage Before Playdates", "folder": "weekly-2027/week-32-back-to-school-family-safety-talk", "files": [{"path": "weekly-2027/week-32-back-to-school-family-safety-talk/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-32-back-to-school-family-safety-talk/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/", "sticker_text": "", "caption": "Back-to-School Safety: Asking About Safe Storage Before Playdates\n\nਸਕੂਲ ਸ਼ੁਰੂ ਹੋਣ 'ਤੇ ਮਾਪਿਆਂ ਲਈ ਸੁਰੱਖਿਆ ਸੁਨੇਹਾ — ਬੱਚਿਆਂ ਦੀ ਸੁਰੱਖਿਆ ਸਭ ਤੋਂ ਪਹਿਲਾਂ\n\nJust as parents ask about food allergies or swimming pools before a playdate, having calm, respectful conversations about locked home storage keeps every child safe.\n\n• Normalize Calm Safety Questions: Asking whether firearms are locked in a safe protects kids without judgment.\n• Review the 4 Kid Rules Together: Practice STOP • Don't Touch • Leave Area • Tell an Adult before school starts.\n• Audit After-School Rooms: Verify safes and lockboxes are latched whenever teens or friends visit after school.\n• Free Bilingual Family Leaflets: Download printable guides anytime at sikhrpa.org.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #BackToSchool #ChildSafety #SafeStorage #FamilySafety #FirearmSafetyEducation #StaySafeBeResponsible", "notes": "Share to Story so California parents see this calm, practical back-to-school reminder!"}, {"id": "w2027-33", "badge": "W33", "tab": "y2027", "date": "Tue, Aug 17, 2027", "time": "5:30 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q3", "title": "Save a Laminated GPS 911 Card in Your Range Bag Before You Drive Out", "folder": "weekly-2027/week-33-remote-range-gps-911-card", "files": [{"path": "weekly-2027/week-33-remote-range-gps-911-card/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-33-remote-range-gps-911-card/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/trauma-safety.html", "sticker_text": "", "caption": "Save a Laminated GPS 911 Card in Your Range Bag Before You Drive Out\n\nਦੂਰ-ਦੁਰਾਡੇ ਰੇਂਜ 'ਤੇ ਜਾਣ ਤੋਂ ਪਹਿਲਾਂ GPS ਕੋਆਰਡੀਨੇਟ ਅਤੇ ੯੧੧ ਸਕ੍ਰਿਪਟ ਤਿਆਰ ਰੱਖੋ\n\nCell reception drops fast on California forest roads and BLM ranges. Writing down exact GPS coordinates, gate codes, and the nearest highway marker shaves critical minutes off EMS response.\n\n• Save Latitude & Longitude Offline: Screenshot or write exact decimal GPS coordinates on a weatherproof card.\n• Note Gate Code & Helicopter LZ: Include locked gate combinations and flat open clearing notes for medevac.\n• Assign a Highway Escort: Always send one range partner to meet the ambulance at the main highway entrance.\n• Generate Your Custom Card: Use our free 911 Range Script tool at sikhrpa.org/trauma-safety.html.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/trauma-safety.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nMedical Disclaimer: Provided strictly for general safety awareness and does not constitute medical advice. Always dial 911 in an emergency and pursue hands-on training through ACS Stop the Bleed® or the Red Cross.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #RangeSafety #EmergencyPreparedness #StopTheBleed #FirstAidEducation #CaliforniaOutdoors #StaySafeBeResponsible", "notes": "Add a Link sticker to sikhrpa.org/trauma-safety.html ('Generate & screenshot your range GPS 911 script before your next trip!')."}, {"id": "w2027-34", "badge": "W34", "tab": "y2027", "date": "Tue, Aug 24, 2027", "time": "12:00 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q3", "title": "The Ball & Dummy Drill: Exposing Recoil Anticipation Instantly", "folder": "weekly-2027/week-34-ball-and-dummy-diagnostic-drill", "files": [{"path": "weekly-2027/week-34-ball-and-dummy-diagnostic-drill/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-34-ball-and-dummy-diagnostic-drill/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/shot-diagnosis.html", "sticker_text": "", "caption": "The Ball & Dummy Drill: Exposing Recoil Anticipation Instantly\n\nਬਾਲ ਐਂਡ ਡੰਮੀ ਡ੍ਰਿਲ — ਰੀਕੋਇਲ ਦੇ ਝਟਕੇ ਨੂੰ ਤੁਰੰਤ ਪਛਾਣਨ ਦਾ ਸਭ ਤੋਂ ਵਧੀਆ ਤਰੀਕਾ\n\nThink you aren't flinching? Have a trusted range partner mix one inert snap cap randomly into your magazine — your sights will tell the exact truth.\n\n• How to Set It Up Safely: A range partner loads 4 live rounds + 1 bright inert snap cap in a secret order.\n• Watch the Front Sight on 'Click': When you press on the dummy round, any downward dip exposes subconscious flinching.\n• Correct Immediately: Relax your dominant hand to 30%, clamp 70% with support hand, and press straight back.\n• Target Standard: Zero muzzle dip when the striker clicks on the inert dummy round.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/shot-diagnosis.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #MarksmanshipFundamentals #PistolFundamentals #RangeSafety #TriggerControl #StaySafeBeResponsible", "notes": "Add a Poll sticker: 'Have you ever caught a surprise flinch on a dummy round?' ('Yes — humbling!' / 'Trying this next range day!')"}, {"id": "w2027-35", "badge": "W35", "tab": "y2027", "date": "Wed, Sep 1, 2027", "time": "10:00 AM PDT", "format": "4:5 Feed Post + 9:16 Story • Q3", "title": "First Parkash Purab of Sri Guru Granth Sahib Ji (1604) (Yes)", "folder": "weekly-2027/week-35-first-parkash-guru-granth-sahib-ji", "files": [{"path": "weekly-2027/week-35-first-parkash-guru-granth-sahib-ji/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-35-first-parkash-guru-granth-sahib-ji/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/heritage.html", "sticker_text": "", "caption": "Waheguru Ji Ka Khalsa, Waheguru Ji Ki Fateh!\n\nਧੰਨ ਧੰਨ ਸ੍ਰੀ ਗੁਰੂ ਗ੍ਰੰਥ ਸਾਹਿਬ ਜੀ ਦੇ ਪਹਿਲੇ ਪ੍ਰਕਾਸ਼ ਪੁਰਬ ਦੀਆਂ ਲੱਖ-ਲੱਖ ਵਧਾਈਆਂ!\n\nCommemorating the sacred installation of Sri Adi Granth Sahib Ji at Sachkhand Sri Harmandir Sahib in 1604 by Sri Guru Arjan Dev Ji, with Baba Buddha Ji as first Granthi.\n\n• Universal Wisdom for All Humanity: Gurbani unites hymns of the Sikh Gurus and enlightened Bhagats in timeless harmony.\n• Truthful Living & Humility: Let wisdom, patience, and compassion guide every word and action in our daily lives.\n• Peace & Sarbat da Bhala: Wishing the entire Sangat worldwide a blessed First Parkash Purab.\n\nLearn more about Sikh heritage, Miri-Piri, and our free bilingual safety resources at sikhrpa.org/heritage.html (Link in bio).\n\nਸਰਬੱਤ ਦਾ ਭਲਾ • ਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#GuruGranthSahibJi #ParkashPurab #PehlaParkash #SikhHeritage #SikhRPA #SikhCommunity #CaliforniaSikhs #StaySafeBeResponsible", "notes": "Share respectfully to your Story wishing the Sangat Lakh-Lakh Vadhaaiyan!"}, {"id": "w2027-36", "badge": "W36", "tab": "y2027", "date": "Tue, Sep 7, 2027", "time": "5:30 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q3", "title": "De-Escalation First: California Brandishing Law (PC § 417) & Sikh Ethics", "folder": "weekly-2027/week-36-brandishing-deescalation-pc417", "files": [{"path": "weekly-2027/week-36-brandishing-deescalation-pc417/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-36-brandishing-deescalation-pc417/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/heritage.html", "sticker_text": "", "caption": "De-Escalation First: California Brandishing Law (PC § 417) & Sikh Ethics\n\nਗੁੱਸੇ ਜਾਂ ਝਗੜੇ ਵਿੱਚ ਕਦੇ ਵੀ ਹਥਿਆਰ ਨਾ ਦਿਖਾਓ — ਸ਼ਾਂਤੀ ਅਤੇ ਕਾਨੂੰਨੀ ਅਨੁਸ਼ਾਸਨ ਸਭ ਤੋਂ ਉੱਪਰ\n\nBoth California law (PC § 417 & CALCRIM 3470) and the Zafarnama teach the exact same truth: a firearm is NEVER for intimidation, road rage, or personal arguments.\n\n• PC § 417 Brandishing Crime: Displaying or drawing a firearm in a rude, angry, or threatening manner is a serious criminal offense.\n• Road Rage & Ego Traps: Walk away, stay inside locked doors, and call 911 — winning an argument is never worth your freedom.\n• Zafarnama Ethic of Last Resort: Force is ethically and legally justified ONLY when facing imminent deadly threat after all peaceful avenues fail.\n• Study Heritage & Statute: Read our Miri-Piri & California law curriculum at sikhrpa.org/heritage.html.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/heritage.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nEducational Disclaimer: Provided exclusively for 501(c)(3) public safety education — not legal advice. Always verify current statutes with the California DOJ Bureau of Firearms or consult a qualified California attorney.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #CaliforniaCompliance #DeEscalation #CaliforniaLaw #MiriPiri #FirearmSafetyEducation #StaySafeBeResponsible", "notes": "Share to Story + Link sticker to sikhrpa.org/heritage.html."}, {"id": "w2027-37", "badge": "W37", "tab": "y2027", "date": "Tue, Sep 14, 2027", "time": "12:00 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q3", "title": "Schedule a Fall 2027 Bilingual Safety Seminar at Your Gurdwara", "folder": "weekly-2027/week-37-fall-gurdwara-workshops-open", "files": [{"path": "weekly-2027/week-37-fall-gurdwara-workshops-open/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-37-fall-gurdwara-workshops-open/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/", "sticker_text": "", "caption": "Schedule a Fall 2027 Bilingual Safety Seminar at Your Gurdwara\n\nਪਤਝੜ 2027 ਲਈ ਗੁਰਦੁਆਰਾ ਸਾਹਿਬ ਵਿਖੇ ਮੁਫ਼ਤ ਸੁਰੱਖਿਆ ਸੈਮੀਨਾਰ ਦੀ ਬੁਕਿੰਗ ਸ਼ੁਰੂ\n\nFall is the ideal time to host a family safe storage and bleeding-control awareness clinic before the busy holiday travel season arrives.\n\n• Classroom-Only Family Format: Respectful, educational presentations tailored for parents, youth, and elders.\n• Free DOJ-Approved Cable Locks: Every attending household receives free CA DOJ cable safety locks & bilingual manuals.\n• Bilingual Punjabi & English: Clear, practical guidance on California PC § 25100 and Stop the Bleed fundamentals.\n• Reserve Your Sunday Slot: Email president@sikhrpa.org to coordinate with your Gurdwara committee.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #GurdwaraOutreach #SafeStorage #CommunityWorkshop #BilingualEducation #CaliforniaSikhs #StaySafeBeResponsible", "notes": "Add a Question sticker: 'Want us at your local Gurdwara this Fall? Drop the city/Gurdwara name!'"}, {"id": "w2027-38", "badge": "W38", "tab": "y2027", "date": "Tue, Sep 21, 2027", "time": "5:30 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q3", "title": "Safe Firearm Cleaning Protocol: Preventing Administrative Accidents", "folder": "weekly-2027/week-38-firearm-cleaning-safety-protocol", "files": [{"path": "weekly-2027/week-38-firearm-cleaning-safety-protocol/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-38-firearm-cleaning-safety-protocol/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/", "sticker_text": "", "caption": "Safe Firearm Cleaning Protocol: Preventing Administrative Accidents\n\nਹਥਿਆਰ ਸਾਫ਼ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਸੁਰੱਖਿਆ ਨਿਯਮ — ਅਸਲੀ ਗੋਲੀਆਂ ਕਮਰੇ ਤੋਂ ਬਾਹਰ ਰੱਖੋ\n\nA surprisingly large share of home firearm accidents happen during cleaning and reassembly. Follow this strict 5-step safety routine every single time.\n\n• 1. Remove ALL Live Ammo From Room: Never clean a firearm on a table with loaded magazines or loose cartridges nearby.\n• 2. Triple-Check Chamber & Magwell: Remove magazine, lock slide open, visually AND physically feel an empty chamber.\n• 3. Ventilate & Protect Eyes: Wear safety glasses against spring tension & solvents; work in a well-ventilated area.\n• 4. Function Check Safely: Point in a confirmed safe direction during reassembly function checks, then lock immediately.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #FirearmSafetyEducation #SafeHandling #HomeSafety #PublicSafetyEducation #StaySafeBeResponsible", "notes": "Share to Story so followers save this maintenance safety checklist!"}, {"id": "w2027-39", "badge": "W39", "tab": "y2027", "date": "Tue, Sep 28, 2027", "time": "12:00 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q3", "title": "Pickup Day Ready: Mastering California's Safe Handling Demonstration", "folder": "weekly-2027/week-39-safe-handling-demo-walkthrough", "files": [{"path": "weekly-2027/week-39-safe-handling-demo-walkthrough/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-39-safe-handling-demo-walkthrough/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/buyer-guide.html", "sticker_text": "", "caption": "Pickup Day Ready: Mastering California's Safe Handling Demonstration\n\nਕੈਲੀਫੋਰਨੀਆ ਸੇਫ ਹੈਂਡਲਿੰਗ ਡੈਮੋ (SHD) — ਡੀਲਰ ਕੋਲ ਪਿਕਅੱਪ ਵਾਲੇ ਦਿਨ ਦੇ ੫ ਕਦਮ\n\nOn Day 10 when you return to pick up your firearm, California requires a physical Safe Handling Demonstration using inert dummy rounds. Know the steps ahead of time.\n\n• 1. Safe Muzzle & Finger Off Trigger: Keep barrel pointed downrange/safe direction and index finger straight on the frame.\n• 2. Unload & Lock Open: Remove magazine, lock slide/action open, and visually & physically inspect the chamber.\n• 3. Load & Chamber Dummy Round: Load the provided inert dummy round, chamber safely, then eject and re-verify clear.\n• 4. Apply DOJ Locking Device: Install the CA DOJ-approved cable lock cleanly through the open action.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/buyer-guide.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nEducational Disclaimer: Provided exclusively for 501(c)(3) public safety education — not legal advice. Always verify current statutes with the California DOJ Bureau of Firearms or consult a qualified California attorney.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #CaliforniaCompliance #SafeHandling #CAFirstTimeGuide #FirearmSafetyEducation #StaySafeBeResponsible", "notes": "Add a Link sticker to sikhrpa.org/buyer-guide.html."}, {"id": "w2027-40", "badge": "W40", "tab": "y2027", "date": "Tue, Oct 5, 2027", "time": "5:30 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q4", "title": "Chest Seals 101: Always Roll & Check the Back for an Exit Wound", "folder": "weekly-2027/week-40-vented-chest-seals-check-the-back", "files": [{"path": "weekly-2027/week-40-vented-chest-seals-check-the-back/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-40-vented-chest-seals-check-the-back/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/trauma-safety.html", "sticker_text": "", "caption": "Chest Seals 101: Always Roll & Check the Back for an Exit Wound\n\nਛਾਤੀ ਦੇ ਜ਼ਖ਼ਮ 'ਤੇ ਵੈਂਟਡ ਚੈਸਟ ਸੀਲ — ਮਰੀਜ਼ ਦੀ ਪਿੱਠ ਜ਼ਰੂਰ ਚੈੱਕ ਕਰੋ!\n\nTorso wounds between the neck and navel can trap air inside the chest cavity. That's why every range IFAK carries a twin-pack of vented chest seals.\n\n• Wipe Blood & Sweat First: Dry the skin around the wound so the hydrogel adhesive seals securely.\n• Apply Vented Seal on Exhale: One-way vents let trapped air escape while blocking outside air from entering.\n• Always Check the Back!: Roll the patient carefully and physically check for an exit wound — seal it with Seal #2.\n• Educational Awareness Only: Always call 911 first & pursue accredited ACS Stop the Bleed® training.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/trauma-safety.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nMedical Disclaimer: Provided strictly for general safety awareness and does not constitute medical advice. Always dial 911 in an emergency and pursue hands-on training through ACS Stop the Bleed® or the Red Cross.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #StopTheBleed #FirstAidEducation #IFAK #RangeSafety #EmergencyPreparedness #StaySafeBeResponsible", "notes": "Add a Quiz sticker: 'Why do trauma IFAKs carry a TWIN pack (2) of vented chest seals?' (A: Spare / B: Entry AND Exit wounds! ✓)"}, {"id": "w2027-41", "badge": "W41", "tab": "y2027", "date": "Tue, Oct 12, 2027", "time": "10:00 AM PDT", "format": "4:5 Feed Post + 9:16 Story • Q4", "title": "Honoring Sri Guru Ram Das Ji & Gurgaddi Diwas of Sri Guru Granth Sahib Ji (Yes)", "folder": "weekly-2027/week-41-guru-ram-das-parkash-gurgaddi-diwas", "files": [{"path": "weekly-2027/week-41-guru-ram-das-parkash-gurgaddi-diwas/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-41-guru-ram-das-parkash-gurgaddi-diwas/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/heritage.html", "sticker_text": "", "caption": "Waheguru Ji Ka Khalsa, Waheguru Ji Ki Fateh!\n\nਧੰਨ ਧੰਨ ਸ੍ਰੀ ਗੁਰੂ ਰਾਮਦਾਸ ਜੀ ਦੇ ਪ੍ਰਕਾਸ਼ ਪੁਰਬ ਅਤੇ ਗੁਰਗੱਦੀ ਦਿਵਸ ਦੀਆਂ ਲੱਖ-ਲੱਖ ਵਧਾਈਆਂ!\n\nCelebrating the Parkash Purab of Sri Guru Ram Das Ji (Oct 9 — founder of Sri Amritsar and embodiment of selfless Seva) and Gurgaddi Diwas of Sri Guru Granth Sahib Ji (Oct 20 — declared our Eternal Guru in 1708).\n\n• Sri Guru Ram Das Ji (Oct 9): Taught boundless humility, community hospitality, and the sacred spirit of Amritsar.\n• Gurgaddi Diwas (Oct 20 • 1708): Sri Guru Gobind Singh Ji bestowed eternal Guruship upon Sri Guru Granth Sahib Ji at Nanded.\n• Living by Gurbani: Seeking wisdom, ethical restraint, and compassionate Seva in every corner of California.\n\nLearn more about Sikh heritage, Miri-Piri, and our free bilingual safety resources at sikhrpa.org/heritage.html (Link in bio).\n\nਸਰਬੱਤ ਦਾ ਭਲਾ • ਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#GuruRamDasJi #GurgaddiDiwas #GuruGranthSahibJi #SikhHeritage #SikhRPA #SikhCommunity #StaySafeBeResponsible", "notes": "Share with your Sangat for October Gurpurab & Gurgaddi Diwas celebrations!"}, {"id": "w2027-42", "badge": "W42", "tab": "y2027", "date": "Tue, Oct 19, 2027", "time": "5:30 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q4", "title": "Reading Your Target: What High-Right, 6:00 Low & 9:00 Left Mean", "folder": "weekly-2027/week-42-diagnosing-all-8-target-sectors", "files": [{"path": "weekly-2027/week-42-diagnosing-all-8-target-sectors/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-42-diagnosing-all-8-target-sectors/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/shot-diagnosis.html", "sticker_text": "", "caption": "Reading Your Target: What High-Right, 6:00 Low & 9:00 Left Mean\n\nਨਿਸ਼ਾਨੇਬਾਜ਼ੀ ਦੀਆਂ ਗਲਤੀਆਂ ਦੀ ਪਛਾਣ — 8-ਸੈਕਟਰ ਟਾਰਗੈੱਟ ਡਾਇਲ ਗਾਈਡ\n\nWhile 7:00–8:00 Low-Left is the #1 pattern, every clock sector on your target reveals a specific biomechanical habit you can fix cleanly.\n\n• 6:00 Straight Low: Breaking both wrists downward or dropping your head right before ignition.\n• 9:00 Straight Left (Too Little Finger): Pressing with only the extreme fingertip pushes the frame sideways like a wedge.\n• 1:00–2:00 High-Right (Heeling): Shoving the heel of your palm forward into the backstrap as the shot breaks.\n• Interactive Right & Left-Handed Wheel: Tap your exact impact zone free at sikhrpa.org/shot-diagnosis.html.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/shot-diagnosis.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #MarksmanshipFundamentals #PistolFundamentals #Biomechanics #RangeSafety #StaySafeBeResponsible", "notes": "Add a Quiz sticker: 'For a right-handed shooter, what causes shots to land 9:00 straight left?' (A: Too little trigger finger ✓ / B: Too much finger)"}, {"id": "w2027-43", "badge": "W43", "tab": "y2027", "date": "Fri, Oct 29, 2027", "time": "10:00 AM PDT", "format": "4:5 Feed Post + 9:16 Story • Q4", "title": "Happy Bandi Chhor Diwas — Freedom, Justice & Light (Yes)", "folder": "weekly-2027/week-43-bandi-chhor-diwas-2027", "files": [{"path": "weekly-2027/week-43-bandi-chhor-diwas-2027/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-43-bandi-chhor-diwas-2027/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/heritage.html", "sticker_text": "", "caption": "Waheguru Ji Ka Khalsa, Waheguru Ji Ki Fateh!\n\nਬੰਦੀ ਛੋੜ ਦਿਵਸ 2027 ਦੀਆਂ ਸਮੂਹ ਸੰਗਤ ਨੂੰ ਲੱਖ-ਲੱਖ ਵਧਾਈਆਂ!\n\nCelebrating the joyous return of Sri Guru Hargobind Sahib Ji to Sri Amritsar after refusing personal release from Gwalior Fort until all 52 unjustly imprisoned princes walked free beside Him.\n\n• Freedom for Others First: True courage uses strength to liberate the oppressed — never for self-interest alone.\n• Lamps of Peace & Solidarity: May your home shine with warmth, safety, harmony, and spiritual illumination.\n• Celebrate Safely: Keep families, elders, and children safe during evening festivities and gatherings.\n\nLearn more about Sikh heritage, Miri-Piri, and our free bilingual safety resources at sikhrpa.org/heritage.html (Link in bio).\n\nਸਰਬੱਤ ਦਾ ਭਲਾ • ਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#BandiChhorDiwas #BandiChhorDiwas2027 #GuruHargobindSahibJi #MiriPiri #SikhRPA #SikhCommunity #CaliforniaSikhs #StaySafeBeResponsible", "notes": "Share this Bandi Chhor Diwas greeting to your Story & wish the Sangat peace and light!"}, {"id": "w2027-44", "badge": "W44", "tab": "y2027", "date": "Tue, Nov 2, 2027", "time": "12:00 PM PST", "format": "4:5 Feed Post + 9:16 Story • Q4", "title": "Clocks Fall Back This Week: Check Optic & Safe Batteries Too!", "folder": "weekly-2027/week-44-daylight-saving-battery-lock-check", "files": [{"path": "weekly-2027/week-44-daylight-saving-battery-lock-check/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-44-daylight-saving-battery-lock-check/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/zero-optics.html", "sticker_text": "", "caption": "Clocks Fall Back This Week: Check Optic & Safe Batteries Too!\n\nਸਮਾਂ ਬਦਲਣ (Fall Back) ਦੇ ਨਾਲ ਆਪਣੀ ਸੇਫ਼ ਅਤੇ ਓਪਟਿਕ ਦੀਆਂ ਬੈਟਰੀਆਂ ਵੀ ਜ਼ਰੂਰ ਬਦਲੋ\n\nTie your safety gear check to Daylight Saving Time every November: fresh smoke-alarm batteries, fresh lockbox batteries, and fresh optic batteries.\n\n• Electronic Lockboxes & Safes: Swap batteries before low-voltage warnings lock you out or cause failed reads.\n• Red Dot Optics: Install a fresh quality coin cell (e.g., CR2032/CR1632) and verify torque & zero.\n• Weapon/Handheld Flashlights: Test lumen output & pack spare batteries in your home emergency kit.\n• IFAK Expiration Check: Check hemostatic gauze and chest seal integrity once a year.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/zero-optics.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #SafeStorage #HomeSafety #EmergencyPreparedness #FirearmSafetyEducation #StaySafeBeResponsible", "notes": "Share to Story on Daylight Saving weekend with a Poll: 'Did you swap your safe & smoke-alarm batteries?'"}, {"id": "w2027-45", "badge": "W45", "tab": "y2027", "date": "Tue, Nov 9, 2027", "time": "5:30 PM PST", "format": "4:5 Feed Post + 9:16 Story • Q4", "title": "Still Carrying a 'Federal Limits Apply' CA License? Know the Rule", "folder": "weekly-2027/week-45-real-id-holiday-travel-and-compliance", "files": [{"path": "weekly-2027/week-45-real-id-holiday-travel-and-compliance/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-45-real-id-holiday-travel-and-compliance/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/buyer-guide.html", "sticker_text": "", "caption": "Still Carrying a 'Federal Limits Apply' CA License? Know the Rule\n\nਜੇ ਤੁਹਾਡੇ CA ਲਾਇਸੈਂਸ 'ਤੇ 'Federal Limits Apply' ਲਿਖਿਆ ਹੈ, ਤਾਂ ਪਾਸਪੋਰਟ ਜਾਂ ਗ੍ਰੀਨ ਕਾਰਡ ਨਾਲ ਰੱਖੋ\n\nCheck the top-right corner of your California Driver's License: a Golden Bear with a white star means REAL ID. 'FEDERAL LIMITS APPLY' requires certified legal-presence proof.\n\n• REAL ID (Bear + Star): Satisfies federal primary identification requirements at licensed CA dealers and airports.\n• Federal Limits Apply: Must be paired with an unexpired U.S. Passport, certified U.S. Birth Certificate, or Green Card (I-551).\n• Handgun Residency Still Separate: Even with REAL ID, handgun paperwork still requires matching CA Proof of Residency.\n• Interactive Counter Checklist: Verify every document free at sikhrpa.org/buyer-guide.html.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/buyer-guide.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nEducational Disclaimer: Provided exclusively for 501(c)(3) public safety education — not legal advice. Always verify current statutes with the California DOJ Bureau of Firearms or consult a qualified California attorney.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #REALID #CaliforniaCompliance #CAFirstTimeGuide #PublicSafetyEducation #StaySafeBeResponsible", "notes": "Add a Poll sticker: 'Does your CA Driver's License have the Golden Bear + Star yet?' ('Yes — REAL ID!' / 'Still Federal Limits Apply')"}, {"id": "w2027-46", "badge": "W46", "tab": "y2027", "date": "Sun, Nov 14, 2027", "time": "10:00 AM PST", "format": "4:5 Feed Post + 9:16 Story • Q4", "title": "Happy Guru Nanak Gurpurab 2027 — Parkash Purab (Yes)", "folder": "weekly-2027/week-46-guru-nanak-gurpurab-2027", "files": [{"path": "weekly-2027/week-46-guru-nanak-gurpurab-2027/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-46-guru-nanak-gurpurab-2027/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/", "sticker_text": "", "caption": "Waheguru Ji Ka Khalsa, Waheguru Ji Ki Fateh!\n\nਧੰਨ ਧੰਨ ਸ੍ਰੀ ਗੁਰੂ ਨਾਨਕ ਦੇਵ ਜੀ ਦੇ ਪ੍ਰਕਾਸ਼ ਪੁਰਬ ਦੀਆਂ ਲੱਖ-ਲੱਖ ਵਧਾਈਆਂ!\n\nCelebrating the sacred Parkash Purab of Sri Guru Nanak Dev Ji, founder of Sikhi, whose timeless message of One Creator, equality, honest work, and selfless sharing lights the entire world.\n\n• ਨਾਮ ਜਪੋ • Naam Japo: Live in mindful remembrance of the One Divine Creator in all.\n• ਕਿਰਤ ਕਰੋ • Kirat Karo: Earn an honest, dignified living through truthful effort.\n• ਵੰਡ ਛਕੋ • Vand Chhako: Share your blessings generously with the Sangat and all in need.\n\nLearn more about Sikh heritage, Miri-Piri, and our free bilingual safety resources at sikhrpa.org (Link in bio).\n\nਸਰਬੱਤ ਦਾ ਭਲਾ • ਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#GuruNanakGurpurab #GuruNanakDevJi #Gurpurab2027 #SarbatDaBhala #SikhRPA #SikhCommunity #CaliforniaSikhs #StaySafeBeResponsible", "notes": "Share this Gurpurab Story with your Sangat & add a quiet Gurbani Kirtan track from Instagram Music."}, {"id": "w2027-47", "badge": "W47", "tab": "y2027", "date": "Tue, Nov 23, 2027", "time": "12:00 PM PST", "format": "4:5 Feed Post + 9:16 Story • Q4", "title": "Hosting Thanksgiving Family? Lock Every Firearm Before Guests Arrive", "folder": "weekly-2027/week-47-thanksgiving-guest-storage-audit", "files": [{"path": "weekly-2027/week-47-thanksgiving-guest-storage-audit/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-47-thanksgiving-guest-storage-audit/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/", "sticker_text": "", "caption": "Hosting Thanksgiving Family? Lock Every Firearm Before Guests Arrive\n\nਥੈਂਕਸਗਿਵਿੰਗ 'ਤੇ ਮਹਿਮਾਨਾਂ ਦੇ ਆਉਣ ਤੋਂ ਪਹਿਲਾਂ ੩-ਮਿੰਟ ਦੀ ਸੁਰੱਖਿਅਤ ਸਟੋਰੇਜ ਜਾਂਚ ਕਰੋ\n\nBusy kitchens, visiting cousins, and overnight luggage make holiday weeks the single most important time to verify 100% locked home storage under CA PC § 25100.\n\n• Lock All Bedside & Closet Firearms: Never leave firearms in nightstands or guest-room closets where kids hide and play.\n• Secure Safe Keys & Combinations: Keep backup keys locked away from key hooks and bedroom dressers.\n• Check Parked Vehicles: Never leave firearms unattended in cars parked on streets or driveways.\n• Need a Free CA DOJ Cable Lock?: Email president@sikhrpa.org or attend any free SikhRPA community clinic.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁ     const STORAGE_KEY = 'sikhrpa_mbs_scheduled_v1';
    let currentTab = 'bf';

    function getSaved() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; }
      catch (e) { return {}; }
    }

    function setSaved(state) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function updateProgress() {
      const saved = getSaved();
      const doneCount = ITEMS.filter(x => saved[x.id]).length;
      const pct = ITEMS.length ? Math.round((doneCount / ITEMS.length) * 100) : 0;
      document.getElementById('progressText').textContent = doneCount + ' / ' + ITEMS.length + ' scheduled (' + pct + '%)';
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const prev = btn.textContent;
        btn.classList.add('copied');
        btn.textContent = '✓ Copied!';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.textContent = prev;
        }, 1600);
      });
    }

    function resetProgress() {
      if (!confirm('Clear all scheduled checkmarks?')) return;
      setSaved({});
      render();
    }

    function render() {
      const saved = getSaved();
      updateProgress();
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      ITEMS.filter(x => x.tab === currentTab).forEach(item => {
        const isDone = Boolean(saved[item.id]);
        const card = document.createElement('article');
        card.className = 'card' + (isDone ? ' done' : '');

        const filesHtml = item.files.map(f => {
          const isVideo = f.path.endsWith('.mp4');
          const preview = isVideo
            ? `<div style="height:150px;display:flex;align-items:center;justify-content:center;background:#172554;border-radius:8px;font-weight:900;color:#fbbf24;font-size:14px;">MP4 REEL</div>`
            : `<img src="${f.path}" alt="${f.label}" loading="lazy" />`;
          const stickerBtn = f.sticker_url
            ? `<button type="button" class="mini-link" data-copy="${f.sticker_url.replace(/"/g, '&quot;')}">Copy Link</button>`
            : '';
          return `
            <div class="file-box">
              ${preview}
              <div class="file-name">${f.label}</div>
              <div class="file-actions">
                <a class="mini-link" href="${f.path}" download>Download</a>
                ${stickerBtn}
              </div>
            </div>
          `;
        }).join('');

        const copyButtons = [];
        if (item.caption) {
          copyButtons.push(`<button type="button" class="btn btn-copy" data-copy-caption="1">Copy Caption + Hashtags</button>`);
        }
        if (item.sticker_url) {
          const urlLabel = item.tab === 'bf' ? 'Copy Link Sticker URL' : 'Copy Bio / Story URL';
          copyButtons.push(`<button type="button" class="btn btn-copy" data-copy="${item.sticker_url.replace(/"/g, '&quot;')}">${urlLabel}</button>`);
        }
        if (item.sticker_text) {
          copyButtons.push(`<button type="button" class="btn btn-copy" data-copy="${item.sticker_text.replace(/"/g, '&quot;')}">Copy Sticker Text</button>`);
        }

        const captionDetails = item.caption
          ? `<details><summary>Preview full caption &amp; hashtags</summary><pre></pre></details>`
          : '';

        card.innerHTML = `
          <div class="card-head">
            <div>
              <div class="meta-row">
                <span class="pill">${item.badge}</span>
                <span class="pill pill-blue">${item.date} • ${item.time}</span>
                <span style="font-size:12px;color:#94a3b8;font-weight:700;">${item.format}</span>
              </div>
              <h2>${item.title}</h2>
            </div>
            <label class="check-label">
              <input type="checkbox" ${isDone ? 'checked' : ''} />
              <span>${isDone ? 'Scheduled ✓' : 'Mark Scheduled'}</span>
            </label>
          </div>
          ${item.notes ? `<div class="note-box">${item.notes}</div>` : ''}
          <div class="files-grid">${filesHtml}</div>
          <div class="copy-row">${copyButtons.join('')}</div>
          ${captionDetails}
        `;

        if (item.caption) {
          card.querySelector('pre').textContent = item.caption;
          const capBtn = card.querySelector('[data-copy-caption]');
          if (capBtn) capBtn.addEventListener('click', () => copyText(item.caption, capBtn));
        }

        card.querySelectorAll('[data-copy]').forEach(btn => {
          btn.addEventListener('click', () => copyText(btn.getAttribute('data-copy'), btn));
        });

        const cb = card.querySelector('input[type="checkbox"]');
        cb.addEventListener('change', () => {
          const next = getSaved();
          next[item.id] = cb.checked;
          setSaved(next);
          render();
        });

        grid.appendChild(card);
      });
    }

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        currentTab = btn.getAttribute('data-tab');
        document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b === btn));
        render();
      });
    });

    render();
  </script>
