 "Post 02", "tab": "dec", "date": "Thu, Dec 3, 2026", "time": "5:30 PM PST", "format": "Carousel (6 slides, 4:5)", "title": "The 4 Universal Firearm Safety Rules (English & Gurmukhi)", "folder": "posts/post-02-four-universal-safety-rules", "files": [{"path": "media/jpg/post-02-four-universal-safety-rules/slide-01-cover.jpg", "label": "slide-01-cover.jpg"}, {"path": "media/jpg/post-02-four-universal-safety-rules/slide-02-rule-1.jpg", "label": "slide-02-rule-1.jpg"}, {"path": "media/jpg/post-02-four-universal-safety-rules/slide-03-rule-2.jpg", "label": "slide-03-rule-2.jpg"}, {"path": "media/jpg/post-02-four-universal-safety-rules/slide-04-rule-3.jpg", "label": "slide-04-rule-3.jpg"}, {"path": "media/jpg/post-02-four-universal-safety-rules/slide-05-rule-4.jpg", "label": "slide-05-rule-4.jpg"}, {"path": "media/jpg/post-02-four-universal-safety-rules/slide-06-summary-cta.jpg", "label": "slide-06-summary-cta.jpg"}], "sticker_url": "https://sikhrpa.org/", "sticker_text": "", "caption": "Safe firearm handling rests on four universal rules — zero exceptions, every single time.\n\nSave and share this bilingual English & Gurmukhi reference card with family members, first-time learners, and anyone preparing for the California Firearm Safety Certificate (FSC) exam:\n\n1. Always treat every firearm as loaded.\n   ਹਮੇਸ਼ਾ ਇਹ ਮੰਨ ਕੇ ਚੱਲੋ ਕਿ ਹਥਿਆਰ ਲੋਡ ਹੈ।\n2. Never point at anything you do not wish to destroy.\n   ਬੈਰਲ ਦਾ ਮੂੰਹ ਹਮੇਸ਼ਾ ਸੁਰੱਖਿਅਤ ਦਿਸ਼ਾ ਵੱਲ ਰੱਖੋ।\n3. Keep your finger off the trigger until ready to shoot.\n   ਟਰਿੱਗਰ 'ਤੇ ਉਂਗਲ ਉਦੋਂ ਹੀ ਰੱਖੋ ਜਦੋਂ ਨਿਸ਼ਾਨਾ ਪੂਰਾ ਹੋਵੇ।\n4. Know your target and what is beyond it.\n   ਆਪਣੇ ਨਿਸ਼ਾਨੇ ਅਤੇ ਉਸਦੇ ਪਿੱਛੇ ਦੀ ਜਗ੍ਹਾ ਦਾ ਧਿਆਨ ਰੱਖੋ।\n\nDownload free printable English & Gurmukhi safety handouts anytime at sikhrpa.org (Link in bio).\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #FirearmSafetyRules #FirearmSafetyEducation #BilingualSafety #Gurmukhi #PunjabiCommunity #SikhCommunity #RangeSafety #SafeHandling #CaliforniaCompliance #PublicSafetyEducation #StaySafeBeResponsible", "notes": "Share Slide 6 (the all-in-one bilingual quick reference card) to your Story with the text: 'Screenshot & save this bilingual 4 Rules card for your range bag or family!' Add a Quiz sticker testing Rule #1 ('If a magazine is removed, is the firearm empty?' → 'No — always visually check the chamber!')."}, {"id": "dec-03", "badge": "Post 03", "tab": "dec", "date": "Sat, Dec 5, 2026", "time": "10:00 AM PST", "format": "Reel (9:16 Cover + 5 Storyboard Frames)", "title": "Free 30-Question CA FSC Practice Exam (sikhrpa.org/fsc-quiz.html)", "folder": "posts/post-03-ca-fsc-practice-exam-reel", "files": [{"path": "media/reels/post-03-ca-fsc-practice-exam-reel.mp4", "label": "Compiled MP4 Reel (upload this file!)"}, {"path": "media/jpg/post-03-ca-fsc-practice-exam-reel/reel-00-cover.jpg", "label": "Reel Cover Image (optional)"}], "sticker_url": "https://sikhrpa.org/fsc-quiz.html", "sticker_text": "", "caption": "Preparing for your California Firearm Safety Certificate (FSC) exam? Don't walk up to the counter guessing on California Penal Code rules.\n\nSikhRPA built a 100% free, interactive 30-Question CA FSC Practice Exam aligned with official California Department of Justice guidelines:\n• Full 30-Question Exam or Quick 15-Question Study Mode\n• 75% Passing Threshold Benchmark (23/30 correct)\n• Instant Statutory Explanations after every single question\n• Category Competency Breakdown so you know exactly what to review\n• Works offline on mobile — zero login or fees required\n\nTest yourself today at sikhrpa.org/fsc-quiz.html (Link in bio).\n\nEducational Disclaimer: This practice exam is provided exclusively for public safety education. Official California FSC certification must be administered in-person at a CA DOJ-licensed dealer.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #CaliforniaFSC #FirearmSafetyCertificate #CaliforniaCompliance #FirearmSafetyEducation #SafeStorage #PublicSafetyEducation #StudyGuide #CaliforniaSikhs #SikhCommunity #StaySafeBeResponsible", "notes": "Share this Reel to your Story with a Link sticker to https://sikhrpa.org/fsc-quiz.html and a Slider/Poll sticker: 'Could you score 75%+ on the 30-question CA FSC safety test today?' (Options: 'Easy 100%!' / 'Let me practice first!')."}, {"id": "dec-04", "badge": "Post 04", "tab": "dec", "date": "Tue, Dec 8, 2026", "time": "12:00 PM PST", "format": "Carousel (7 slides, 4:5)", "title": "California First-Time Buyer's Compliance Roadmap (REAL ID, Residency & DROS)", "folder": "posts/post-04-ca-first-time-buyer-roadmap", "files": [{"path": "media/jpg/post-04-ca-first-time-buyer-roadmap/slide-01-cover.jpg", "label": "slide-01-cover.jpg"}, {"path": "media/jpg/post-04-ca-first-time-buyer-roadmap/slide-02-real-id-comparison.jpg", "label": "slide-02-real-id-comparison.jpg"}, {"path": "media/jpg/post-04-ca-first-time-buyer-roadmap/slide-03-proof-of-residency.jpg", "label": "slide-03-proof-of-residency.jpg"}, {"path": "media/jpg/post-04-ca-first-time-buyer-roadmap/slide-04-fsc-exam.jpg", "label": "slide-04-fsc-exam.jpg"}, {"path": "media/jpg/post-04-ca-first-time-buyer-roadmap/slide-05-dros-timeline.jpg", "label": "slide-05-dros-timeline.jpg"}, {"path": "media/jpg/post-04-ca-first-time-buyer-roadmap/slide-06-delivery-transport.jpg", "label": "slide-06-delivery-transport.jpg"}, {"path": "media/jpg/post-04-ca-first-time-buyer-roadmap/slide-07-checklist-cta.jpg", "label": "slide-07-checklist-cta.jpg"}], "sticker_url": "https://sikhrpa.org/buyer-guide.html", "sticker_text": "", "caption": "California has some of the most specific statutory documentation rules in the nation — and simple paperwork oversights are the #1 reason lawful first-time applicants get turned away at the counter.\n\nSwipe through SikhRPA's 5-Step California Compliance Roadmap to prepare every document properly:\n1. Primary ID (CA PC § 26845): Check the top-right corner of your CA Driver's License! If it says 'FEDERAL LIMITS APPLY' instead of displaying the REAL ID Golden Bear & Star, you MUST bring an unexpired U.S. Passport, certified U.S. Birth Certificate, or valid Green Card (Form I-551).\n2. Handgun Proof of Residency (11 CCR § 4045.1): Current DMV registration, municipal utility bill (≤90 days), signed residential lease, or property deed matching your ID address. Cell phone bills, bank statements, and internet/cable bills are strictly rejected.\n3. Firearm Safety Certificate (CA PC § 31615): 30-question exam (75% passing, $25 fee, valid 5 years).\n4. Exact 10-Day (240-Hour) DROS Wait (CA PC § 26815 & § 28220): Counted to the exact second, with a hard 30-day pickup expiration window.\n5. Delivery & Legal Transport (CA PC § 26850 & § 25610): Complete the Safe Handling Demonstration, verify a DOJ-approved lock/safe affidavit, and transport unloaded inside a locked container or trunk.\n\nUse the interactive counter-readiness self-audit checklist free at sikhrpa.org/buyer-guide.html (Link in bio).\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #CaliforniaCompliance #CAFirstTimeGuide #REALID #CaliforniaLaw #FirearmSafetyEducation #SafeStorage #SafeTransport #CaliforniaSikhs #SikhCommunity #PunjabiCommunity #StaySafeBeResponsible", "notes": "Share Slide 2 (the CA 'FEDERAL LIMITS APPLY' vs. REAL ID visual comparison) to your Story with a Poll: 'Did you know about the CA Federal Limits Apply ID rule?' (Options: 'Yes, I knew!' / 'Good thing I checked!') + Link sticker to https://sikhrpa.org/buyer-guide.html."}, {"id": "dec-05", "badge": "Post 05", "tab": "dec", "date": "Thu, Dec 10, 2026", "time": "6:00 PM PST", "format": "Carousel (6 slides, 4:5)", "title": "Holiday Safe Storage, CA Penal Code § 25100 & 3-Minute Pre-Guest Audit", "folder": "posts/post-05-holiday-safe-storage-pc25100", "files": [{"path": "media/jpg/post-05-holiday-safe-storage-pc25100/slide-01-cover.jpg", "label": "slide-01-cover.jpg"}, {"path": "media/jpg/post-05-holiday-safe-storage-pc25100/slide-02-pc25100-law.jpg", "label": "slide-02-pc25100-law.jpg"}, {"path": "media/jpg/post-05-holiday-safe-storage-pc25100/slide-03-three-storage-levels.jpg", "label": "slide-03-three-storage-levels.jpg"}, {"path": "media/jpg/post-05-holiday-safe-storage-pc25100/slide-04-pre-guest-audit.jpg", "label": "slide-04-pre-guest-audit.jpg"}, {"path": "media/jpg/post-05-holiday-safe-storage-pc25100/slide-05-child-safety-rules.jpg", "label": "slide-05-child-safety-rules.jpg"}, {"path": "media/jpg/post-05-holiday-safe-storage-pc25100/slide-06-free-locks-cta.jpg", "label": "slide-06-free-locks-cta.jpg"}], "sticker_url": "https://sikhrpa.org/", "sticker_text": "", "caption": "Hosting family, friends, and visiting children this holiday season? Take 3 minutes to audit your home firearm storage BEFORE guests arrive.\n\nUnder California Penal Code § 25100 and § 25140, criminal storage of an unsecured firearm where a minor under 18 or prohibited person gains access and causes harm is a serious felony. Hiding a firearm on a high closet shelf or inside a nightstand drawer is NOT a legal defense — and never keeps curious children safe.\n\nSwipe through for:\n• CA Penal Code § 25100 & § 25140 summary in English & Gurmukhi\n• The 3 Levels of CA DOJ-Approved Safe Storage (Cable Lock • Biometric Lockbox • Fire-Rated Steel Safe)\n• The 3-Minute Pre-Guest Home Safety Audit checklist\n• The 4 Essential Safety Rules for Kids (STOP • Don't Touch • Leave Area • Tell an Adult / ੧. ਰੁਕੋ • ੨. ਹੱਥ ਨਾ ਲਾਓ • ੩. ਦੂਰ ਹਟੋ • ੪. ਵੱਡਿਆਂ ਨੂੰ ਦੱਸੋ)\n\nNeed a CA DOJ-approved cable lock? SikhRPA distributes free cable safety locks at every community workshop. Email president@sikhrpa.org or visit sikhrpa.org (Link in bio).\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #SafeStorage #HolidaySafety #ChildSafety #CaliforniaLaw #PC25100 #FirearmSafetyEducation #HomeSafety #PublicSafetyEducation #SikhCommunity #CaliforniaSikhs #StaySafeBeResponsible", "notes": "Repost Slide 4 (the 3-Minute Pre-Guest Safety Audit) to your Story with a reminder: 'Hosting family this December? Screenshot this 3-minute safe storage check!' Include a Question sticker: 'Need a free CA DOJ cable lock for your household? DM or email president@sikhrpa.org.'"}, {"id": "dec-06", "badge": "Post 06", "tab": "dec", "date": "Sat, Dec 12, 2026", "time": "10:00 AM PST", "format": "Single Editorial Graphic (4:5) + Story Q&A Template (9:16)", "title": "California Firearms Legal & Regulatory Watch (sikhrpa.org/news.html)", "folder": "posts/post-06-daily-legal-regulatory-watch", "files": [{"path": "media/jpg/post-06-daily-legal-regulatory-watch/post-01-editorial.jpg", "label": "post-01-editorial.jpg"}, {"path": "media/jpg/post-06-daily-legal-regulatory-watch/story-01-qa-template.jpg", "label": "story-01-qa-template.jpg"}], "sticker_url": "https://sikhrpa.org/news.html", "sticker_text": "", "caption": "California firearm statutes, court injunctions, and CA DOJ Bureau of Firearms bulletins change constantly — and staying law-abiding starts with reliable, non-sensationalized information.\n\nSikhRPA maintains a free, automated Daily California Legal & Regulatory Watch archive at sikhrpa.org/news.html tracking five public categories:\n• Chaptered California Legislation & Effective Dates\n• Federal 9th Circuit & District Court Rulings / Stays\n• Official CA DOJ Bureau of Firearms Regulatory Bulletins\n• Authoritative State Reporting\n• Community Safety & Safe Storage Advisories\n\nHave a general educational question about California safe storage, FSC preparation, or regulatory updates? Drop it in our Story Q&A box today or comment below so we can cover it in a future educational guide!\n\nBookmark the permanent archive: sikhrpa.org/news.html (Link in bio)\n\nEducational Disclaimer: SikhRPA is an IRS-recognized 501(c)(3) educational nonprofit and does not provide legal advice or representation. Always consult a qualified California attorney or verify statutes directly with the California DOJ Bureau of Firearms.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #CaliforniaLegalWatch #CaliforniaCompliance #RegulatoryUpdate #PublicSafetyEducation #FirearmSafetyEducation #CaliforniaLaw #CADOJ #SikhCommunity #CaliforniaSikhs #StaySafeBeResponsible", "notes": "Upload story-01-qa-template.png (9:16) to your Instagram Story! Place the native Instagram 'Questions' sticker directly inside the dashed gold interactive box with prompt: 'Ask a CA safety or compliance question!' and add a Link sticker to https://sikhrpa.org/news.html."}, {"id": "dec-07", "badge": "Post 07", "tab": "dec", "date": "Tue, Dec 15, 2026", "time": "12:00 PM PST", "format": "Reel (9:16 Cover + 5 Storyboard Frames)", "title": "Interactive Pistol Shot Diagnostic — Fixing Low-Left (7–8 O'Clock)", "folder": "posts/post-07-pistol-shot-diagnostic-reel", "files": [{"path": "media/reels/post-07-pistol-shot-diagnostic-reel.mp4", "label": "Compiled MP4 Reel (upload this file!)"}, {"path": "media/jpg/post-07-pistol-shot-diagnostic-reel/reel-00-cover.jpg", "label": "Reel Cover Image (optional)"}], "sticker_url": "https://sikhrpa.org/shot-diagnosis.html", "sticker_text": "", "caption": "Are your pistol shots consistently landing low and to the left (7:00–8:00 o'clock)? Nearly 85% of right-handed shooters experience this exact pattern — and it is almost never your sights.\n\nWhat's really happening biomechanically:\n1. Sympathetic Grip Squeeze: As your index finger presses the trigger, your bottom three fingers (middle, ring, pinky) clench involuntarily, pulling the muzzle downward and inward.\n2. Recoil Anticipation: Pre-emptively pushing the wrist down right before the shot breaks.\n3. Trigger Finger Placement: Hooking too deep into the 1st joint crease drags the frame left; use the center pad sweet spot and hinge straight rearward.\n\nThe Fix — The 70/30 Grip Rule:\nApply ~70% clamping pressure with your support hand and keep your dominant hand relaxed (~30%) so your trigger finger moves independently.\n\nDry-Fire Safety Checklist (BEFORE every drill):\n✓ Visually & physically verify chamber & magwell are 100% clear\n✓ Remove ALL live ammunition from the room\n✓ Point strictly at a safe, solid backstop\n\nTry our free interactive 8-sector target wheel (with right & left-handed mirroring) and bilingual drills at sikhrpa.org/shot-diagnosis.html (Link in bio).\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #MarksmanshipFundamentals #PistolFundamentals #DryFireSafety #RangeSafety #FirearmSafetyEducation #TriggerControl #Biomechanics #SikhCommunity #CaliforniaSikhs #StaySafeBeResponsible", "notes": "Share this Reel to your Story with a Poll sticker: 'Where do your pistol groups drift most often?' (Options: '7–8 o'clock Low-Left!' / 'Dead center!') and a Link sticker to https://sikhrpa.org/shot-diagnosis.html."}, {"id": "dec-08", "badge": "Post 08", "tab": "dec", "date": "Thu, Dec 17, 2026", "time": "5:30 PM PST", "format": "Carousel (6 slides, 4:5)", "title": "Bilingual Range Trauma & Stop the Bleed (IFAK Audit, Tourniquet & 911 Script)", "folder": "posts/post-08-bilingual-range-trauma-stop-the-bleed", "files": [{"path": "media/jpg/post-08-bilingual-range-trauma-stop-the-bleed/slide-01-cover.jpg", "label": "slide-01-cover.jpg"}, {"path": "media/jpg/post-08-bilingual-range-trauma-stop-the-bleed/slide-02-three-steps.jpg", "label": "slide-02-three-steps.jpg"}, {"path": "media/jpg/post-08-bilingual-range-trauma-stop-the-bleed/slide-03-tourniquet-rules.jpg", "label": "slide-03-tourniquet-rules.jpg"}, {"path": "media/jpg/post-08-bilingual-range-trauma-stop-the-bleed/slide-04-junctional-chest-hypothermia.jpg", "label": "slide-04-junctional-chest-hypothermia.jpg"}, {"path": "media/jpg/post-08-bilingual-range-trauma-stop-the-bleed/slide-05-ifak-audit.jpg", "label": "slide-05-ifak-audit.jpg"}, {"path": "media/jpg/post-08-bilingual-range-trauma-stop-the-bleed/slide-06-911-dispatch-script.jpg", "label": "slide-06-911-dispatch-script.jpg"}], "sticker_url": "https://sikhrpa.org/trauma-safety.html", "sticker_text": "", "caption": "If you carry safety gear to the range, carry the training and supplies to stop life-threatening bleeding too. Severe arterial bleeding can become fatal in minutes — long before an ambulance reaches a remote outdoor range.\n\nSwipe through SikhRPA's Bilingual Range Trauma & Stop the Bleed Awareness Guide:\n• First 60 Seconds: Call 'CEASE FIRE!' & Dial 911 → Find Bleeding Source → Compress / Tourniquet\n• 4 Mandatory Tourniquet Rules in English & Gurmukhi (ਟੂਰਨੀਕੇਟ ਲਗਾਉਣ ਦੇ ੪ ਲਾਜ਼ਮੀ ਨਿਯਮ): 2–3\" above wound (never on a joint), pull strap max tight, twist windlass until bleeding stops, write time (T: HH:MM) & NEVER loosen\n• Junctional Wound Packing, Vented Chest Seals (check the back for exit wounds!), & Hypothermia Prevention\n• 6-Item Range Bag IFAK Checklist (use only authentic CoTCCC-approved tourniquets like CAT Gen 7, SOFTT-W, or SAM XT)\n• Verbatim Remote Range 911 Dispatch Script with GPS coordinates & highway gate escort\n\nRead the full bilingual guide & use the interactive IFAK Auditor and GPS 911 Script Generator at sikhrpa.org/trauma-safety.html (Link in bio).\n\nMedical Disclaimer: Provided strictly for general safety awareness and does not constitute medical advice. Always dial 911 in an emergency and pursue formal hands-on training through the American College of Surgeons Stop the Bleed® program or the American Red Cross.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #StopTheBleed #FirstAidEducation #RangeSafety #EmergencyPreparedness #IFAK #PublicSafetyEducation #BilingualSafety #Gurmukhi #SikhCommunity #CaliforniaSikhs #StaySafeBeResponsible", "notes": "Share Slide 5 (the 6-Item Range Bag IFAK Audit) to your Story with a Poll sticker: 'Do you carry a stocked IFAK on the outside of your range bag?' (Options: 'Yes — 6/6 ready!' / 'Building mine this week!') + Link sticker to https://sikhrpa.org/trauma-safety.html."}, {"id": "dec-09", "badge": "Post 09", "tab": "dec", "date": "Sat, Dec 19, 2026", "time": "10:00 AM PST", "format": "Carousel (6 slides, 4:5)", "title": "How to Zero Optics — Centroid Triangulation, MOA vs MIL, Click Scaling & Height-Over-Bore", "folder": "posts/post-09-how-to-zero-optics", "files": [{"path": "media/jpg/post-09-how-to-zero-optics/slide-01-cover.jpg", "label": "slide-01-cover.jpg"}, {"path": "media/jpg/post-09-how-to-zero-optics/slide-02-centroid-triangulation.jpg", "label": "slide-02-centroid-triangulation.jpg"}, {"path": "media/jpg/post-09-how-to-zero-optics/slide-03-moa-vs-mil.jpg", "label": "slide-03-moa-vs-mil.jpg"}, {"path": "media/jpg/post-09-how-to-zero-optics/slide-04-click-scaling.jpg", "label": "slide-04-click-scaling.jpg"}, {"path": "media/jpg/post-09-how-to-zero-optics/slide-05-height-over-bore.jpg", "label": "slide-05-height-over-bore.jpg"}, {"path": "media/jpg/post-09-how-to-zero-optics/slide-06-five-step-cta.jpg", "label": "slide-06-five-step-cta.jpg"}], "sticker_url": "https://sikhrpa.org/zero-optics.html", "sticker_text": "", "caption": "Stop burning ammunition chasing single bullet holes on paper! Zeroing a pistol red dot or rifle scope is pure geometry once you understand four simple principles.\n\nSwipe through SikhRPA's visual technical guide to zeroing optics accurately:\n• 5-Shot Group Centroid Triangulation: Never adjust for one shot — fire a rested 3–5 shot group, find the Mean Point of Impact (MPI), and dial once.\n• MOA vs. MIL (MRAD): 1 MOA ≈ 1.047\" at 100 yds (1/4, 1/2, or 1 MOA clicks) vs. 1 MIL = 3.60\" at 100 yds (0.1 MIL = 0.36\" per click). Golden Rule: turret arrows ('UP' / 'R') move your bullet impact (POI)!\n• 25 / 50 / 100-Yard Click Scaling: Closer targets mean smaller inch-per-click shifts — so 25 yards requires 4× as many clicks per inch as 100 yards.\n• Height-Over-Bore Mechanical Offset: Because an optic sits ~2.6\" above a carbine bore (~0.8\" on pistols), close 3–7 yard shots naturally hit 1.5\"–2.5\" below your dot.\n• 5-Step Field Zeroing Protocol in English & Gurmukhi (ਸਹੀ ਜ਼ੀਰੋਇੰਗ ਲਈ ੫ ਜ਼ਰੂਰੀ ਕਦਮ)\n\nPlot your target hits and get exact turret clicks automatically — zero math required — with our free Zeroing Click Calculator at sikhrpa.org/zero-optics.html (Link in bio).\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #OpticsZeroing #MarksmanshipFundamentals #BallisticsEducation #MOAvsMIL #RangeSafety #FirearmSafetyEducation #HeightOverBore #TechnicalEducation #SikhCommunity #CaliforniaSikhs #StaySafeBeResponsible", "notes": "Share Slide 4 (the 25/50/100-Yard Click Scaling chart) to your Story with the text: 'Bookmark this click scaling chart for your next range day!' and a Link sticker to https://sikhrpa.org/zero-optics.html."}, {"id": "dec-10", "badge": "Post 10", "tab": "dec", "date": "Tue, Dec 22, 2026 (Shaheedi Week)", "time": "12:00 PM PST", "format": "Carousel (6 slides, 4:5)", "title": "Shaheedi Week Reflection — Miri-Piri, Sant-Sipahi & Sikh Martial Heritage", "folder": "posts/post-10-miri-piri-shaheedi-week", "files": [{"path": "media/jpg/post-10-miri-piri-shaheedi-week/slide-01-cover.jpg", "label": "slide-01-cover.jpg"}, {"path": "media/jpg/post-10-miri-piri-shaheedi-week/slide-02-sahibzaade-tribute.jpg", "label": "slide-02-sahibzaade-tribute.jpg"}, {"path": "media/jpg/post-10-miri-piri-shaheedi-week/slide-03-miri-piri.jpg", "label": "slide-03-miri-piri.jpg"}, {"path": "media/jpg/post-10-miri-piri-shaheedi-week/slide-04-sant-sipahi.jpg", "label": "slide-04-sant-sipahi.jpg"}, {"path": "media/jpg/post-10-miri-piri-shaheedi-week/slide-05-zafarnama.jpg", "label": "slide-05-zafarnama.jpg"}, {"path": "media/jpg/post-10-miri-piri-shaheedi-week/slide-06-modern-stewardship.jpg", "label": "slide-06-modern-stewardship.jpg"}], "sticker_url": "https://sikhrpa.org/heritage.html", "sticker_text": "", "caption": "During Shaheedi Week (Poh / late December), we bow our heads in solemn remembrance of the Chaar Sahibzaade — Baba Ajit Singh Ji, Baba Jujhar Singh Ji, Baba Zorawar Singh Ji, and Baba Fateh Singh Ji — alongside Mata Gujri Ji and the devoted Sikhs of Chamkaur Sahib and Sirhind.\n\nTheir sacrifice illuminates the deepest truth of Sikh martial heritage: strength is never rooted in aggression, vanity, or dominance. It is bound to spiritual humility (Piri), moral restraint (Miri), and unwavering protection of human dignity.\n\nIn the Zafarnama (Verse 22), Guru Gobind Singh Ji articulated the ethic that guides our educational mission to this day:\nਚੁ ਕਾਰ ਅਜ਼ ਹਮਹ ਹੀਲਤੇ ਦਰ ਗੁਜ਼ਸ਼ਤ ॥\nਹਲਾਲ ਅਸਤ ਬੁਰਦਨ ਬ ਸ਼ਮਸ਼ੀਰ ਦਸਤ ॥੨੨॥\n\"When all other peaceful avenues have been exhausted and every remedy has failed, only then is it righteous to take up the sword.\"\n\nToday, honoring that sacred covenant of Shastar reverence means exercising total discipline: de-escalation first, strict obedience to the law, safe home storage to protect every child, and humble service (Seva) to our Sangat and neighbors.\n\nRead our complete educational curriculum on Sikh Martial Heritage & Responsible Stewardship at sikhrpa.org/heritage.html (Link in bio).\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #ShaheediWeek #ChaarSahibzaade #MataGujriJi #MiriPiri #SantSipahi #SikhHeritage #SikhHistory #SikhCommunity #CaliforniaSikhs #ResponsibleStewardship #StaySafeBeResponsible", "notes": "Share Slide 1 or Slide 5 (Zafarnama Verse 22) respectfully to your Story with minimal overlay — add a quiet Link sticker to https://sikhrpa.org/heritage.html and text: 'Remembering the Chaar Sahibzaade and Mata Gujri Ji this Shaheedi Week.'"}, {"id": "dec-11", "badge": "Post 11", "tab": "dec", "date": "Thu, Dec 24, 2026", "time": "4:00 PM PST", "format": "Single Community Poster (4:5) + Story Template (9:16)", "title": "Host a Free 2027 Safety & Safe Storage Workshop at Your Gurdwara", "folder": "posts/post-11-host-2027-gurdwara-workshop", "files": [{"path": "media/jpg/post-11-host-2027-gurdwara-workshop/post-01-poster.jpg", "label": "post-01-poster.jpg"}, {"path": "media/jpg/post-11-host-2027-gurdwara-workshop/story-01-workshop-share.jpg", "label": "story-01-workshop-share.jpg"}], "sticker_url": "https://sikhrpa.org/", "sticker_text": "", "caption": "Planning your Gurdwara Sahib or Sikh community center's 2027 educational calendar? Partner with SikhRPA to host a 100% FREE bilingual Safety & Safe Storage Workshop!\n\nWhat SikhRPA provides at zero cost to your Gurdwara or Sangat:\n• Certified bilingual instructors presenting in Punjabi & English\n• Practical California Safe Storage education (CA Penal Code § 25100) & child safety rules\n• Welcoming, classroom-only environment open to families, women (Bibian), elders & absolute beginners\n• Optional Stop the Bleed / Gurdwara bleeding-control cabinet & Sevadaar readiness briefing\n• FREE CA DOJ-approved cable safety locks & printed bilingual safety handbooks for every attending family\n\nਗੁਰਦੁਆਰਾ ਸਾਹਿਬ ਵਿਖੇ ਕੈਂਪ: ਆਪਣੇ ਸਥਾਨਕ ਗੁਰਦੁਆਰਾ ਸਾਹਿਬ ਵਿੱਚ ਪੰਜਾਬੀ ਵਿੱਚ ਮੁਫ਼ਤ ਸੁਰੱਖਿਆ ਸੈਮੀਨਾਰ ਕਰਵਾਉਣ ਲਈ ਸਾਨੂੰ ਈਮੇਲ ਕਰੋ: president@sikhrpa.org\n\nReserve a 2027 date for your Bay Area, Central Valley, Sacramento, or Southern California Gurdwara:\nEmail: president@sikhrpa.org | Web: sikhrpa.org | Federal EIN: 42-2595402\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #GurdwaraOutreach #SafeStorage #CommunityWorkshop #FirearmSafetyEducation #BilingualEducation #PunjabiCommunity #CaliforniaSikhs #SikhCommunity #PublicSafetyEducation #Nonprofit501c3 #StaySafeBeResponsible", "notes": "Upload story-01-workshop-share.png (9:16) to your Story! Invite followers to tag their local California Gurdwara committee or forward the Story to a Sevadaar, and add a Link sticker to https://sikhrpa.org/ with text 'Email president@sikhrpa.org for 2027 dates'."}, {"id": "dec-12", "badge": "Post 12", "tab": "dec", "date": "Sat, Dec 26, 2026", "time": "10:30 AM PST", "format": "Reel Cover (9:16) + Carousel (5 slides, 4:5)", "title": "Year-End 501(c)(3) Tax-Deductible Giving Appeal (Before Dec 31)", "folder": "posts/post-12-year-end-501c3-giving-appeal", "files": [{"path": "media/jpg/post-12-year-end-501c3-giving-appeal/reel-00-cover.jpg", "label": "reel-00-cover.jpg"}, {"path": "media/jpg/post-12-year-end-501c3-giving-appeal/slide-01-cover.jpg", "label": "slide-01-cover.jpg"}, {"path": "media/jpg/post-12-year-end-501c3-giving-appeal/slide-02-what-we-built.jpg", "label": "slide-02-what-we-built.jpg"}, {"path": "media/jpg/post-12-year-end-501c3-giving-appeal/slide-03-impact-tiers.jpg", "label": "slide-03-impact-tiers.jpg"}, {"path": "media/jpg/post-12-year-end-501c3-giving-appeal/slide-04-how-to-give.jpg", "label": "slide-04-how-to-give.jpg"}, {"path": "media/jpg/post-12-year-end-501c3-giving-appeal/slide-05-thank-you-cta.jpg", "label": "slide-05-thank-you-cta.jpg"}], "sticker_url": "https://sikhrpa.org/donate.html", "sticker_text": "", "caption": "Only 5 days remain to make a 2026 tax-deductible contribution before December 31 at 11:59 PM!\n\nBecause the Sikh Rifle and Pistol Association (SikhRPA) is an IRS-recognized 501(c)(3) public charity (Federal EIN: 42-2595402), every dollar you give is tax-deductible under IRC § 170 and directly powers free public safety education in 2027:\n\n• $20 — Provides 1 free CA DOJ-approved cable safety lock for a California family\n• $50 — Prints and distributes 100 pocket English & Gurmukhi safety reference manuals\n• $150 — Supplies 10 beginner students with ANSI Z87.1 eye & 30+ dB ear protection\n• $1,000 — Fully sponsors an in-person bilingual Gurdwara Safety & Safe Storage Workshop\n\nWays to Give Before Dec 31:\n1. Zelle® (0% Fees — 100% to mission): Tag 'sikhrpa' (include your email in the memo for your IRS receipt)\n2. PayPal / Card / Venmo: sikhrpa.org/donate.html (PayPal ID: #S5PAN9B85U28J)\n3. Employer Corporate Match: Search EIN 42-2595402 in Benevity or CyberGrants — double your impact!\n4. Official IRS Tax Receipt / Form W-9: Request anytime at sikhrpa.org/receipt.html or president@sikhrpa.org\n\nThank you for standing with us to keep California families safe, informed, and compliant.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #YearEndGiving #Nonprofit501c3 #TaxDeductible #PublicSafetyEducation #SafeStorage #FirearmSafetyEducation #Dasvandh #SikhCommunity #CaliforniaSikhs #PunjabiCommunity #StaySafeBeResponsible", "notes": "Post reel-00-cover.png (9:16) as a Year-End Countdown Story or Reel cover! Add an Instagram 'Countdown' sticker set to Dec 31, 2026 11:59 PM PST ('2026 Tax-Deductible Giving Closes') and a Link sticker directly to https://sikhrpa.org/donate.html."}, {"id": "w2027-01", "badge": "W01", "tab": "y2027", "date": "Tue, Jan 5, 2027", "time": "12:00 PM PST", "format": "4:5 Feed Post + 9:16 Story • Q1", "title": "Start 2027 Right: The Annual Home Safe Storage Audit", "folder": "weekly-2027/week-01-new-year-safe-storage-audit", "files": [{"path": "weekly-2027/week-01-new-year-safe-storage-audit/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-01-new-year-safe-storage-audit/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/", "sticker_text": "", "caption": "Start 2027 Right: The Annual Home Safe Storage Audit\n\nਨਵੇਂ ਸਾਲ 2027 ਦੀ ਸ਼ੁਰੂਆਤ — ਆਪਣੇ ਘਰ ਦੀ ਸੁਰੱਖਿਅਤ ਸਟੋਰੇਜ ਦੀ ਜਾਂਚ ਕਰੋ\n\nKick off the new year by checking every lockbox battery, safe combination, cable lock, and ammunition storage bin in your household.\n\n• Check Lockbox Batteries: Replace AA/9V batteries in biometric & electronic safes every January and verify backup keys.\n• Verify CA PC § 25100 Compliance: Confirm zero firearms are stored unlocked in nightstands, closets, or guest areas.\n• Separate & Lock Ammunition: Keep ammunition dry, labeled, and secured in a dedicated locked container.\n• Refresh Family Safety Rules: Review STOP • Don't Touch • Leave Area • Tell an Adult with children.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #SafeStorage #NewYear2027 #FirearmSafetyEducation #CAHomeSafety #PC25100 #SikhCommunity #StaySafeBeResponsible", "notes": "Tap to vote: Have you checked your safe batteries & locks for 2027? (Poll: 'All locked & checked!' / 'Doing it tonight!')"}, {"id": "w2027-02", "badge": "W02", "tab": "y2027", "date": "Thu, Jan 14–15, 2027", "time": "10:00 AM PST", "format": "4:5 Feed Post + 9:16 Story • Q1", "title": "Parkash Purab of Sri Guru Gobind Singh Ji & Maghi (Yes)", "folder": "weekly-2027/week-02-guru-gobind-singh-gurpurab-maghi", "files": [{"path": "weekly-2027/week-02-guru-gobind-singh-gurpurab-maghi/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-02-guru-gobind-singh-gurpurab-maghi/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/heritage.html", "sticker_text": "", "caption": "Waheguru Ji Ka Khalsa, Waheguru Ji Ki Fateh!\n\nਧੰਨ ਧੰਨ ਸ੍ਰੀ ਗੁਰੂ ਗੋਬਿੰਦ ਸਿੰਘ ਜੀ ਦੇ ਪ੍ਰਕਾਸ਼ ਪੁਰਬ ਅਤੇ ਮਾਘੀ (ਚਾਲੀ ਮੁਕਤੇ) ਦੀਆਂ ਲੱਖ-ਲੱਖ ਵਧਾਈਆਂ!\n\nHonoring Dashmesh Pita, founder of the Khalsa and the Sant-Sipahi (Saint-Soldier) ideal, alongside the supreme devotion of the Chali Mukte at Sri Muktsar Sahib. (Observed Jan 5 Nanakshahi / Jan 15 Lunar.)\n\n• Sant-Sipahi Discipline: Spiritual humility (Sant) paired with courageous, disciplined duty to defend justice (Sipahi).\n• Chali Mukte (Maghi • Jan 14): Remembering Mai Bhago Ji and the Forty Liberated Ones for selfless loyalty and forgiveness.\n• Modern Stewardship: Carrying Guru Ji's legacy through lawful conduct, compassion, and protecting every household.\n\nLearn more about Sikh heritage, Miri-Piri, and our free bilingual safety resources at sikhrpa.org/heritage.html (Link in bio).\n\nਸਰਬੱਤ ਦਾ ਭਲਾ • ਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#GuruGobindSinghJi #Gurpurab #Maghi #ChaliMukte #SantSipahi #SikhRPA #SikhHeritage #CaliforniaSikhs #StaySafeBeResponsible", "notes": "Share with your Sangat & add a quiet Link sticker to sikhrpa.org/heritage.html."}, {"id": "w2027-03", "badge": "W03", "tab": "y2027", "date": "Tue, Jan 19, 2027", "time": "12:00 PM PST", "format": "4:5 Feed Post + 9:16 Story • Q1", "title": "New Year, New Statutes: How to Track 2027 California Laws", "folder": "weekly-2027/week-03-2027-ca-legal-watch-check", "files": [{"path": "weekly-2027/week-03-2027-ca-legal-watch-check/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-03-2027-ca-legal-watch-check/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/news.html", "sticker_text": "", "caption": "New Year, New Statutes: How to Track 2027 California Laws\n\nਕੈਲੀਫੋਰਨੀਆ ਦੇ ਨਵੇਂ 2027 ਕਾਨੂੰਨਾਂ ਅਤੇ DOJ ਅਪਡੇਟਸ ਦੀ ਸਹੀ ਜਾਣਕਾਰੀ ਰੱਖੋ\n\nMany chaptered California bills take effect on January 1 each year. Verify real statutory text instead of relying on social media rumors.\n\n• Check Effective Dates: Review chaptered bills that became operative on January 1, 2027.\n• Monitor Court Stays & Injunctions: 9th Circuit rulings can pause or reinstate provisions rapidly.\n• Read CA DOJ Bulletins Directly: Follow official Bureau of Firearms compliance advisories.\n• Bookmark SikhRPA Legal Watch: Search our free daily automated archive at sikhrpa.org/news.html.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/news.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nEducational Disclaimer: Provided exclusively for 501(c)(3) public safety education — not legal advice. Always verify current statutes with the California DOJ Bureau of Firearms or consult a qualified California attorney.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #CaliforniaCompliance #CaliforniaLegalWatch #CADOJ #PublicSafetyEducation #CaliforniaSikhs #StaySafeBeResponsible", "notes": "Place an Instagram Question sticker: 'What 2027 CA compliance topic should we break down next?' + Link sticker to sikhrpa.org/news.html."}, {"id": "w2027-04", "badge": "W04", "tab": "y2027", "date": "Tue, Jan 26, 2027", "time": "5:30 PM PST", "format": "4:5 Feed Post + 9:16 Story • Q1", "title": "The 70 / 30 Grip Rule: Eliminating Sympathetic Squeeze", "folder": "weekly-2027/week-04-mastering-70-30-pistol-grip", "files": [{"path": "weekly-2027/week-04-mastering-70-30-pistol-grip/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-04-mastering-70-30-pistol-grip/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/shot-diagnosis.html", "sticker_text": "", "caption": "The 70 / 30 Grip Rule: Eliminating Sympathetic Squeeze\n\nਸਹੀ ਗ੍ਰਿੱਪ ਤਕਨੀਕ — 70% ਸਪੋਰਟ ਹੱਥ ਦਾ ਦਬਾਅ ਅਤੇ 30% ਮੁੱਖ ਹੱਥ ਦਾ ਸੰਤੁਲਨ\n\nYour dominant hand shouldn't death-grip the pistol. Transferring 70% of clamping pressure to your support hand frees your trigger finger to press straight back.\n\n• 70% Support Hand Clamp: Fill the exposed grip panel firmly with your support palm and lock your wrist forward.\n• 30% Dominant Hand: Hold like a firm handshake so your index finger hinges independently.\n• Empty-Hand Diagnostic: Curl your trigger finger empty-handed — watch if your pinky twitches inward.\n• Free Interactive Analyzer: Diagnose target patterns right or left-handed at sikhrpa.org/shot-diagnosis.html.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/shot-diagnosis.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #MarksmanshipFundamentals #PistolFundamentals #TriggerControl #RangeSafety #FirearmSafetyEducation #StaySafeBeResponsible", "notes": "Add a Poll sticker: 'When you curl your index finger empty-handed, does your pinky twitch?' ('Yes, guilty!' / 'Steady as a rock!')"}, {"id": "w2027-05", "badge": "W05", "tab": "y2027", "date": "Tue, Feb 2, 2027", "time": "12:00 PM PST", "format": "4:5 Feed Post + 9:16 Story • Q1", "title": "Understanding California's FFL03 + COE Credential Process", "folder": "weekly-2027/week-05-ffl03-coe-california-overview", "files": [{"path": "weekly-2027/week-05-ffl03-coe-california-overview/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-05-ffl03-coe-california-overview/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/buyer-guide.html", "sticker_text": "", "caption": "Understanding California's FFL03 + COE Credential Process\n\nਕੈਲੀਫੋਰਨੀਆ FFL03 (ਫੈਡਰਲ ਕਲੈਕਟਰ ਲਾਇਸੈਂਸ) ਅਤੇ COE ਪ੍ਰਕਿਰਿਆ ਦੀ ਕਾਨੂੰਨੀ ਜਾਣਕਾਰੀ\n\nAn educational overview of the federal Curio & Relic Collector's License (ATF Form 7 CR) paired with California's DOJ Certificate of Eligibility (CFARS).\n\n• Phase 1 — ATF Form 7 CR (FFL03): Individual federal collector license ($30 / 3-year term) + informational copy to local CLEO.\n• Phase 2 — CA DOJ COE (CFARS): Apply online via CFARS and complete authorized California Live Scan fingerprinting.\n• Annual Renewal & Record-Keeping: Maintain an A&D bound book for any C&R items and renew your CA COE annually.\n• Keep Address Current: Notify both ATF and CA DOJ promptly if you move so credentials always match.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/buyer-guide.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nEducational Disclaimer: Provided exclusively for 501(c)(3) public safety education — not legal advice. Always verify current statutes with the California DOJ Bureau of Firearms or consult a qualified California attorney.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #CaliforniaCompliance #CFARS #PublicSafetyEducation #CaliforniaLaw #SikhCommunity #StaySafeBeResponsible", "notes": "Add a Poll sticker: 'Would you like a deep-dive guide on CA CFARS & COE compliance?' ('Yes, please!' / 'Already familiar!')"}, {"id": "w2027-06", "badge": "W06", "tab": "y2027", "date": "Tue, Feb 9, 2027", "time": "5:30 PM PST", "format": "4:5 Feed Post + 9:16 Story • Q1", "title": "Why Counterfeit Tourniquets Fail — Carry CoTCCC Approved Only", "folder": "weekly-2027/week-06-spot-counterfeit-tourniquets", "files": [{"path": "weekly-2027/week-06-spot-counterfeit-tourniquets/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-06-spot-counterfeit-tourniquets/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/trauma-safety.html", "sticker_text": "", "caption": "Why Counterfeit Tourniquets Fail — Carry CoTCCC Approved Only\n\nਨਕਲੀ ਟੂਰਨੀਕੇਟ ਐਮਰਜੈਂਸੀ ਵਿੱਚ ਟੁੱਟ ਸਕਦੇ ਹਨ — ਸਿਰਫ਼ ਅਸਲੀ CoTCCC ਮਾਨਤਾ-ਪ੍ਰਾਪਤ ਵਰਤੋ\n\nGeneric look-alike tourniquets often bend or snap their windlass rod under real arterial pressure. Inspect your range bag IFAK today.\n\n• Authentic CoTCCC Brands: Choose proven brands: CAT Gen 7 (North American Rescue), SOFTT-W, or SAM XT.\n• Stage Out of Plastic Wrapper: Remove factory shrink-wrap before packing so it deploys one-handed in seconds.\n• Inspect Windlass & Time Strap: Verify rigid composite/aluminum windlass, sharp stitching, and intact white time strap.\n• Take Hands-On Training: Enroll in an accredited ACS Stop the Bleed® or Red Cross first-aid course.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/trauma-safety.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nMedical Disclaimer: Provided strictly for general safety awareness and does not constitute medical advice. Always dial 911 in an emergency and pursue hands-on training through ACS Stop the Bleed® or the Red Cross.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #StopTheBleed #FirstAidEducation #IFAK #RangeSafety #EmergencyPreparedness #PublicSafetyEducation #StaySafeBeResponsible", "notes": "Add a Quiz sticker: 'Should your range tourniquet stay sealed inside factory plastic?' (A: Yes / B: No — unwrap & stage it! ✓)"}, {"id": "w2027-07", "badge": "W07", "tab": "y2027", "date": "Tue, Feb 16, 2027", "time": "12:00 PM PST", "format": "4:5 Feed Post + 9:16 Story • Q1", "title": "3 Dangerous Firearm Safety Myths (English & Gurmukhi)", "folder": "weekly-2027/week-07-bilingual-safety-myth-busters", "files": [{"path": "weekly-2027/week-07-bilingual-safety-myth-busters/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-07-bilingual-safety-myth-busters/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/", "sticker_text": "", "caption": "3 Dangerous Firearm Safety Myths (English & Gurmukhi)\n\nਗਲਤ ਧਾਰਨਾ: 'ਮੈਗਜ਼ੀਨ ਕੱਢ ਦਿੱਤੀ ਹੈ ਤਾਂ ਬੰਦੂਕ ਖਾਲੀ ਹੈ।' — ਸੱਚਾਈ: ਚੈਂਬਰ ਦੀ ਖੁਦ ਜਾਂਚ ਕਰੋ!\n\nPreventable negligent discharges almost always begin with a false assumption. Share these three myth-busters with every new learner.\n\n• Myth 1: Magazine Out = Empty: Reality: A live cartridge can remain inside the chamber. Visually & physically inspect.\n• Myth 2: Mechanical Safety = Safe: Reality: Safeties are mechanical devices that can fail — never rely on them over muzzle discipline.\n• Myth 3: High Shelf = Childproof: Reality: Kids climb. Only a CA DOJ-certified lockbox, safe, or cable lock secures a home.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #FirearmSafetyEducation #BilingualSafety #Gurmukhi #SafeHandling #PunjabiCommunity #StaySafeBeResponsible", "notes": "Add a Quiz sticker: 'If a mechanical thumb safety is ON, is it okay to rest your finger on the trigger?' (A: Yes / B: NEVER! ✓)"}, {"id": "w2027-08", "badge": "W08", "tab": "y2027", "date": "Tue, Feb 23, 2027", "time": "5:30 PM PST", "format": "4:5 Feed Post + 9:16 Story • Q1", "title": "Understanding Handgun Ergonomics: Grip Height, Length & Fit", "folder": "weekly-2027/week-08-ca-handgun-size-ccw-ergonomics", "files": [{"path": "weekly-2027/week-08-ca-handgun-size-ccw-ergonomics/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-08-ca-handgun-size-ccw-ergonomics/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/handgun-compare.html", "sticker_text": "", "caption": "Understanding Handgun Ergonomics: Grip Height, Length & Fit\n\nਹੈਂਡਗੰਨ ਸਾਈਜ਼ ਅਤੇ ਗ੍ਰਿੱਪ ਫਿੱਟ ਦੀ ਵਿਗਿਆਨਕ ਤੁਲਨਾ — 1:1 ਸਕੇਲ ਗਾਈਡ\n\nA firearm that fits your hand promotes safer trigger reach and better recoil control. Compare California Roster dimensions 1:1 at sikhrpa.org/handgun-compare.html.\n\n• Grip Height (Printing Factor): Grip height — not barrel length — is the #1 dimensional factor in concealed-carry silhouette.\n• Slide Length & Keel Stability: Slightly longer slides improve sight radius and holster balance along the belt line.\n• Trigger Reach & Control: Ensure the center pad of your index finger reaches the trigger cleanly without breaking grip.\n• 1:1 True-Scale Overlay Tool: Compare CA Roster dimensions side-by-side free at sikhrpa.org/handgun-compare.html.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/handgun-compare.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #MarksmanshipFundamentals #CaliforniaCompliance #Ergonomics #FirearmSafetyEducation #CaliforniaSikhs #StaySafeBeResponsible", "notes": "Add a Link sticker to sikhrpa.org/handgun-compare.html + Poll: 'What matters most to you in handgun ergonomics?' ('Grip fit' / 'Weight & size')"}, {"id": "w2027-09", "badge": "W09", "tab": "y2027", "date": "Tue, Mar 2, 2027", "time": "12:00 PM PST", "format": "4:5 Feed Post + 9:16 Story • Q1", "title": "5-Minute CA FSC Study Sprint: Pass With Confidence", "folder": "weekly-2027/week-09-fsc-exam-study-sprint", "files": [{"path": "weekly-2027/week-09-fsc-exam-study-sprint/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-09-fsc-exam-study-sprint/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/fsc-quiz.html", "sticker_text": "", "caption": "5-Minute CA FSC Study Sprint: Pass With Confidence\n\nਕੈਲੀਫੋਰਨੀਆ FSC 30-ਸਵਾਲਾਂ ਵਾਲੀ ਸੁਰੱਖਿਆ ਪ੍ਰੀਖਿਆ ਦੀ ਮੁਫ਼ਤ ਤਿਆਰੀ ਕਰੋ\n\nTake our Quick 15-Question drill or Full 30-Question CA DOJ model test on your phone before visiting a licensed California dealer.\n\n• 75% Passing Benchmark: Answer at least 23 of 30 multiple-choice & true/false questions correctly.\n• Learn Real Statutes: Every question explains the underlying California Penal Code rule immediately.\n• Identify Weak Categories: Category analytics show whether to review Storage, Handling, or Transport.\n• 100% Free & Offline Ready: Practice anytime at sikhrpa.org/fsc-quiz.html (official exam is in-person at dealer).\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/fsc-quiz.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nEducational Disclaimer: Provided exclusively for 501(c)(3) public safety education — not legal advice. Always verify current statutes with the California DOJ Bureau of Firearms or consult a qualified California attorney.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #CaliforniaFSC #FirearmSafetyCertificate #CaliforniaCompliance #StudyGuide #PublicSafetyEducation #StaySafeBeResponsible", "notes": "Add a Quiz sticker: 'How long is a California Firearm Safety Certificate (FSC) valid?' (A: 2 years / B: 5 years ✓ / C: 10 years)"}, {"id": "w2027-10", "badge": "W10", "tab": "y2027", "date": "Tue, Mar 9, 2027", "time": "5:30 PM PST", "format": "4:5 Feed Post + 9:16 Story • Q1", "title": "Spring 2027 Gurdwara Safe Storage Workshops Now Booking", "folder": "weekly-2027/week-10-spring-gurdwara-workshop-booking", "files": [{"path": "weekly-2027/week-10-spring-gurdwara-workshop-booking/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-10-spring-gurdwara-workshop-booking/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/", "sticker_text": "", "caption": "Spring 2027 Gurdwara Safe Storage Workshops Now Booking\n\nਬਸੰਤ 2027 ਲਈ ਆਪਣੇ ਗੁਰਦੁਆਰਾ ਸਾਹਿਬ ਵਿਖੇ ਮੁਫ਼ਤ ਸੁਰੱਖਿਆ ਸੈਮੀਨਾਰ ਬੁੱਕ ਕਰੋ\n\nSikhRPA's certified bilingual instructors are scheduling Spring 2027 classroom seminars across the Bay Area, Central Valley, Sacramento, and Southern California.\n\n• 100% Free to Every Gurdwara: Zero cost to committees or families — funded by 501(c)(3) public charity support.\n• Punjabi & English Curriculum: CA safe storage laws, child safety rules, and Gurdwara Stop the Bleed awareness.\n• Free CA DOJ Cable Locks: Every attending family receives free DOJ-approved cable safety locks & bilingual leaflets.\n• Book Your Date: Email president@sikhrpa.org to coordinate a Sunday post-Diwan seminar.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #GurdwaraOutreach #SafeStorage #BilingualEducation #PunjabiCommunity #CaliforniaSikhs #Nonprofit501c3 #StaySafeBeResponsible", "notes": "Add a Question sticker: 'Which California city or Gurdwara should we visit this Spring?' + email president@sikhrpa.org."}, {"id": "w2027-11", "badge": "W11", "tab": "y2027", "date": "Sun, Mar 14, 2027", "time": "10:00 AM PDT", "format": "4:5 Feed Post + 9:16 Story • Q1", "title": "Happy Sikh New Year — Nanakshahi Samvat 559 (Chet) (Yes)", "folder": "weekly-2027/week-11-sikh-new-year-chet-nanakshahi-559", "files": [{"path": "weekly-2027/week-11-sikh-new-year-chet-nanakshahi-559/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-11-sikh-new-year-chet-nanakshahi-559/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/heritage.html", "sticker_text": "", "caption": "Waheguru Ji Ka Khalsa, Waheguru Ji Ki Fateh!\n\nਨਾਨਕਸ਼ਾਹੀ ਨਵੇਂ ਸਾਲ (ਸੰਮਤ 559 • ੧ ਚੇਤ) ਦੀਆਂ ਸਮੂਹ ਸੰਗਤ ਨੂੰ ਲੱਖ-ਲੱਖ ਵਧਾਈਆਂ!\n\nWelcoming the first day of Chet in the Nanakshahi calendar with prayers for Chardi Kala (rising spirits), family well-being, and renewed commitment to community Seva.\n\n• Chardi Kala (Ever-Rising Spirit): Step into the new year with optimism, gratitude, and disciplined service to all.\n• Protect & Educate Our Youth: Pass down Sikh values of humility, responsibility, and safety across generations.\n• Free Community Resources: Explore bilingual safety & heritage tools anytime at sikhrpa.org.\n\nLearn more about Sikh heritage, Miri-Piri, and our free bilingual safety resources at sikhrpa.org/heritage.html (Link in bio).\n\nਸਰਬੱਤ ਦਾ ਭਲਾ • ਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhNewYear #Nanakshahi559 #Chet #ChardiKala #SikhRPA #SikhCommunity #CaliforniaSikhs #StaySafeBeResponsible", "notes": "Share this Sikh New Year greeting to your Story & wish the Sangat Chardi Kala!"}, {"id": "w2027-12", "badge": "W12", "tab": "y2027", "date": "Tue, Mar 23, 2027", "time": "10:00 AM PDT", "format": "4:5 Feed Post + 9:16 Story • Q1", "title": "Hola Mohalla: Martial Discipline, Humility & Seva (Yes)", "folder": "weekly-2027/week-12-hola-mohalla-2027", "files": [{"path": "weekly-2027/week-12-hola-mohalla-2027/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-12-hola-mohalla-2027/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/heritage.html", "sticker_text": "", "caption": "Waheguru Ji Ka Khalsa, Waheguru Ji Ki Fateh!\n\nਹੋਲਾ ਮੁਹੱਲਾ 2027 ਦੀਆਂ ਲੱਖ-ਲੱਖ ਵਧਾਈਆਂ — ਅਨੁਸ਼ਾਸਨ, ਨਿਮਰਤਾ ਅਤੇ ਸੇਵਾ ਦਾ ਪ੍ਰਤੀਕ!\n\nEstablished by Sri Guru Gobind Singh Ji at Anandpur Sahib in 1701, Hola Mohalla celebrates physical readiness, Shastar Vidya discipline, spiritual kirtan, and fearless service.\n\n• Discipline Over Bravado: True martial readiness in Sikh tradition is measured by calm control, never recklessness.\n• Reverence for Shastar: Careful maintenance, safe handling, and locked storage honor centuries of Shastar reverence.\n• Community & Seva: Gatka, kirtan, and Langar unite generations in strength and compassion.\n\nLearn more about Sikh heritage, Miri-Piri, and our free bilingual safety resources at sikhrpa.org/heritage.html (Link in bio).\n\nਸਰਬੱਤ ਦਾ ਭਲਾ • ਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#HolaMohalla #HolaMohalla2027 #ShastarVidya #MiriPiri #SikhHeritage #SikhRPA #SikhCommunity #StaySafeBeResponsible", "notes": "Share with the Sangat + Link sticker to sikhrpa.org/heritage.html."}, {"id": "w2027-13", "badge": "W13", "tab": "y2027", "date": "Tue, Mar 30, 2027", "time": "5:30 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q1", "title": "Range PPE Essentials: Eyes, Double Ears & Lead Hygiene", "folder": "weekly-2027/week-13-eye-ear-lead-range-protection", "files": [{"path": "weekly-2027/week-13-eye-ear-lead-range-protection/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-13-eye-ear-lead-range-protection/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/", "sticker_text": "", "caption": "Range PPE Essentials: Eyes, Double Ears & Lead Hygiene\n\nਰੇਂਜ ਸੁਰੱਖਿਆ — ਅੱਖਾਂ (ANSI Z87.1), ਕੰਨਾਂ ਦੀ ਸੁਰੱਖਿਆ ਅਤੇ ਲੈੱਡ (Lead) ਤੋਂ ਸਫ਼ਾਈ\n\nHearing damage is permanent and lead residue transfers to cars and homes. Build a rock-solid personal protection routine for every range trip.\n\n• ANSI Z87.1 Eye Protection: Always wear impact-rated wrap-around eyewear to shield against brass and debris.\n• Double Up Hearing Protection: Pair foam earplugs under 30+ dB earmuffs — especially at indoor ranges.\n• Cold Water + Lead-Removing Soap: Wash hands and face with COLD water (hot water opens pores) before eating or driving.\n• Dedicated Range Shoes & Clothing: Change shoes before entering homes with crawling toddlers or infants.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #RangeSafety #HearingProtection #FirearmSafetyEducation #PublicSafetyEducation #SafeHandling #StaySafeBeResponsible", "notes": "Add a Poll sticker: 'Did you know you should wash with COLD water after the range so pores stay closed?' ('Yes!' / 'Great tip!')"}, {"id": "w2027-14", "badge": "W14", "tab": "y2027", "date": "Tue, Apr 6, 2027", "time": "12:00 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q2", "title": "Celebrating Sikh Heritage Month Through Community Safety", "folder": "weekly-2027/week-14-sikh-heritage-month-kickoff", "files": [{"path": "weekly-2027/week-14-sikh-heritage-month-kickoff/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-14-sikh-heritage-month-kickoff/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/heritage.html", "sticker_text": "", "caption": "Celebrating Sikh Heritage Month Through Community Safety\n\nਅਪ੍ਰੈਲ ਸਿੱਖ ਵਿਰਾਸਤ ਮਹੀਨਾ — ਸਿੱਖਿਆ, ਸੇਵਾ ਅਤੇ ਪਰਿਵਾਰਕ ਸੁਰੱਖਿਆ\n\nEvery April, California celebrates Sikh Heritage Month — honoring Sikh contributions to civic life, service (Seva), and responsible community leadership.\n\n• Seva Through Public Safety: SikhRPA serves California families of all backgrounds with 100% free bilingual safety tools.\n• Honoring Miri-Piri: Balancing spiritual humility with civic stewardship and respect for the law.\n• Share Bilingual Guides: Send sikhrpa.org to parents, elders, and new California residents this month.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/heritage.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhHeritageMonth #SikhRPA #CaliforniaSikhs #SikhCommunity #Seva #PublicSafetyEducation #StaySafeBeResponsible", "notes": "Add a Link sticker to sikhrpa.org/heritage.html + invite followers to share how their family practices Seva."}, {"id": "w2027-15", "badge": "W15", "tab": "y2027", "date": "Wed, Apr 14, 2027", "time": "10:00 AM PDT", "format": "4:5 Feed Post + 9:16 Story • Q2", "title": "Vaisakhi & Khalsa Sajna Diwas — Celebrating 1699 (Yes)", "folder": "weekly-2027/week-15-vaisakhi-khalsa-sajna-diwas-2027", "files": [{"path": "weekly-2027/week-15-vaisakhi-khalsa-sajna-diwas-2027/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-15-vaisakhi-khalsa-sajna-diwas-2027/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/heritage.html", "sticker_text": "", "caption": "Waheguru Ji Ka Khalsa, Waheguru Ji Ki Fateh!\n\nਵਿਸਾਖੀ ਅਤੇ ਖ਼ਾਲਸਾ ਸਾਜਨਾ ਦਿਵਸ ਦੀਆਂ ਸਮੂਹ ਸੰਗਤ ਨੂੰ ਲੱਖ-ਲੱਖ ਵਧਾਈਆਂ!\n\nOn Vaisakhi 1699 at Sri Anandpur Sahib, Sri Guru Gobind Singh Ji established the Khalsa Panth — uniting equality, fearless integrity, and selfless defense of human dignity.\n\n• Equality & Courage (1699): The Panj Pyare stood for truth across every background, caste, and region.\n• Moral Covenant of Duty: Strength is forever bound to humility, compassion, and protecting the defenseless.\n• Sarbat da Bhala: Wishing every family and Nagar Kirtan Sangat across California a joyful, safe Vaisakhi!\n\nLearn more about Sikh heritage, Miri-Piri, and our free bilingual safety resources at sikhrpa.org/heritage.html (Link in bio).\n\nਸਰਬੱਤ ਦਾ ਭਲਾ • ਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#Vaisakhi #Vaisakhi2027 #KhalsaSajnaDiwas #SikhHeritageMonth #SikhRPA #CaliforniaSikhs #SikhCommunity #StaySafeBeResponsible", "notes": "Repost to your Story & tag your local California Nagar Kirtan or Gurdwara celebration!"}, {"id": "w2027-16", "badge": "W16", "tab": "y2027", "date": "Tue, Apr 20, 2027", "time": "5:30 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q2", "title": "How to Legally Transport Firearms in Your Vehicle in California", "folder": "weekly-2027/week-16-ca-vehicle-transport-pc25610", "files": [{"path": "weekly-2027/week-16-ca-vehicle-transport-pc25610/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-16-ca-vehicle-transport-pc25610/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/buyer-guide.html", "sticker_text": "", "caption": "How to Legally Transport Firearms in Your Vehicle in California\n\nਕੈਲੀਫੋਰਨੀਆ ਵਿੱਚ ਕਾਰ ਰਾਹੀਂ ਹਥਿਆਰ ਸੁਰੱਖਿਅਤ ਅਤੇ ਕਾਨੂੰਨੀ ਤੌਰ 'ਤੇ ਲਿਜਾਣ ਦੇ ਨਿਯਮ\n\nHeading to the range? One mistake in your car — like using the glovebox or leaving a loaded magazine inserted — can violate California law.\n\n• 100% Unloaded: Verify chamber empty and no loaded magazine inserted in the firearm.\n• Locked Container or Trunk: Place handguns in a fully enclosed locked container or inside a separate locked trunk.\n• NEVER Glovebox or Console: CA PC § 16850 explicitly excludes utility compartments, gloveboxes, and center consoles.\n• Direct Destination Rule: Keep transport direct to/from lawful destinations (range, home, FFL) and never leave unattended.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/buyer-guide.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nEducational Disclaimer: Provided exclusively for 501(c)(3) public safety education — not legal advice. Always verify current statutes with the California DOJ Bureau of Firearms or consult a qualified California attorney.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #SafeTransport #CaliforniaCompliance #CaliforniaLaw #RangeSafety #FirearmSafetyEducation #StaySafeBeResponsible", "notes": "Add a Quiz sticker: 'Is a locked glove compartment a legal locked container for a handgun in CA?' (A: Yes / B: NO — prohibited by PC § 16850! ✓)"}, {"id": "w2027-17", "badge": "W17", "tab": "y2027", "date": "Tue, Apr 27, 2027", "time": "12:00 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q2", "title": "Two Proven Dry-Fire Drills to Fix Trigger Flinch at Home", "folder": "weekly-2027/week-17-casing-and-wall-dry-fire-drills", "files": [{"path": "weekly-2027/week-17-casing-and-wall-dry-fire-drills/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-17-casing-and-wall-dry-fire-drills/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/shot-diagnosis.html", "sticker_text": "", "caption": "Two Proven Dry-Fire Drills to Fix Trigger Flinch at Home\n\nਘਰ ਵਿੱਚ ਸੁਰੱਖਿਅਤ ਡਰਾਈ-ਫਾਇਰ ਅਭਿਆਸ — ਕਾਰਤੂਸ ਡ੍ਰਿਲ ਅਤੇ ੨-ਇੰਚ ਕੰਧ ਡ੍ਰਿਲ\n\nBuild rock-steady trigger control without firing a single live round — always starting with our strict 4-point unloaded safety verification.\n\n• Mandatory Safety First: Unload, lock slide open, visually & physically verify clear, ZERO live ammo in the room.\n• Drill 1: Spent Casing / Coin Drill: Balance a casing behind the front sight; aim for 10 smooth breaks without dropping it.\n• Drill 2: The 2-Inch Wall Drill: Stand 2 inches from a blank wall and focus 100% on keeping the front sight completely still.\n• 10 Minutes Daily: Short, deliberate, zero-flinch dry-fire sessions outperform rushing boxes of ammo.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/shot-diagnosis.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #DryFireSafety #MarksmanshipFundamentals #TriggerControl #FirearmSafetyEducation #StaySafeBeResponsible", "notes": "Share to Story with a Link sticker to sikhrpa.org/shot-diagnosis.html."}, {"id": "w2027-18", "badge": "W18", "tab": "y2027", "date": "Tue, May 4, 2027", "time": "5:30 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q2", "title": "May Is Stop the Bleed Month: 3 Life-Saving Steps Everyone Should Know", "folder": "weekly-2027/week-18-national-stop-the-bleed-month", "files": [{"path": "weekly-2027/week-18-national-stop-the-bleed-month/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-18-national-stop-the-bleed-month/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/trauma-safety.html", "sticker_text": "", "caption": "May Is Stop the Bleed Month: 3 Life-Saving Steps Everyone Should Know\n\nਮਈ 'ਸਟਾਪ ਦ ਬਲੀਡ' ਮਹੀਨਾ — ਖੂਨ ਵਹਿਣਾ ਰੋਕਣ ਦੇ ੩ ਜ਼ਰੂਰੀ ਕਦਮ ਸਿੱਖੋ\n\nSevere bleeding is the #1 preventable cause of death after trauma — whether at a shooting range, highway crash, or community event.\n\n• 1. Ensure Safety & Call 911: Call 'CEASE FIRE!' or secure the scene, then dial 911 immediately with exact location.\n• 2. Find the Bleeding Source: Cut or move clothing to locate bright red arterial spurting or pooling blood.\n• 3. Compress (Pressure / TQ): Apply a CoTCCC tourniquet 2–3\" above limb wounds, or pack junctional wounds & hold firm pressure.\n• Get Certified Hands-On: Find an official ACS Stop the Bleed® class near you & study free at sikhrpa.org/trauma-safety.html.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/trauma-safety.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nMedical Disclaimer: Provided strictly for general safety awareness and does not constitute medical advice. Always dial 911 in an emergency and pursue hands-on training through ACS Stop the Bleed® or the Red Cross.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #StopTheBleed #StopTheBleedMonth #FirstAidEducation #EmergencyPreparedness #PublicSafetyEducation #StaySafeBeResponsible", "notes": "Add a Poll sticker: 'Have you taken a hands-on Stop the Bleed or CPR/First Aid class?' ('Yes — certified!' / 'Signing up this year!')"}, {"id": "w2027-19", "badge": "W19", "tab": "y2027", "date": "Tue, May 11, 2027", "time": "12:00 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q2", "title": "Firearm Safety Is for Every Member of the Household", "folder": "weekly-2027/week-19-welcoming-women-and-first-timers", "files": [{"path": "weekly-2027/week-19-welcoming-women-and-first-timers/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-19-welcoming-women-and-first-timers/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/", "sticker_text": "", "caption": "Firearm Safety Is for Every Member of the Household\n\nਸਾਡੇ ਸਾਰੇ ਸੈਮੀਨਾਰ ਪਰਿਵਾਰਾਂ, ਬੀਬੀਆਂ ਅਤੇ ਨਵੇਂ ਸਿੱਖਣ ਵਾਲਿਆਂ ਲਈ ਖੁੱਲ੍ਹੇ ਹਨ\n\nEven if a family member never plans to shoot, knowing the 4 Universal Rules and how to verify a safe home storage system protects everyone.\n\n• Zero-Intimidation Environment: Patient, structured instruction built for absolute beginners and women (Bibian).\n• Shared Household Literacy: Every adult in a home with firearms should understand safe storage & child safety rules.\n• Bilingual Punjabi & English: Clear explanations for parents and elders without confusing jargon.\n• Free Learning Tools: Start safely at home anytime with sikhrpa.org.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #FirearmSafetyEducation #FamilySafety #BilingualEducation #SikhCommunity #CaliforniaSikhs #StaySafeBeResponsible", "notes": "Add a Question sticker: 'Absolute beginner question? Ask anonymously here — zero judgment!'"}, {"id": "w2027-20", "badge": "W20", "tab": "y2027", "date": "Tue, May 18, 2027", "time": "5:30 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q2", "title": "Zeroing a Pistol Red Dot: 15 Yards vs. 25 Yards", "folder": "weekly-2027/week-20-pistol-red-dot-zero-15-vs-25-yd", "files": [{"path": "weekly-2027/week-20-pistol-red-dot-zero-15-vs-25-yd/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-20-pistol-red-dot-zero-15-vs-25-yd/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/zero-optics.html", "sticker_text": "", "caption": "Zeroing a Pistol Red Dot: 15 Yards vs. 25 Yards\n\nਪਿਸਤੌਲ ਰੈੱਡ-ਡੌਟ ਜ਼ੀਰੋਇੰਗ — ੧੫ ਗਜ਼ ਬਨਾਮ ੨੫ ਗਜ਼ ਦਾ ਸਹੀ ਫ਼ਰਕ\n\nZeroing a pistol optic at 15 or 25 yards creates a remarkably flat trajectory across practical target distances — use our free click calculator to dial once.\n\n• 15-Yard Practical Zero: Easy to see groups clearly; impacts stay within ~1\" from 5 yards to 35 yards.\n• 25-Yard Precision Zero: Tighter angular alignment at distance; stays flat from 3 yards out to 50 yards.\n• Remember 1 MOA Scaling: A 1 MOA pistol dot moves 0.15\" per click at 15 yd (0.25\" per click at 25 yd).\n• Plot Hits Automatically: Skip the mental math with sikhrpa.org/zero-optics.html.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/zero-optics.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #OpticsZeroing #MarksmanshipFundamentals #BallisticsEducation #RangeSafety #StaySafeBeResponsible", "notes": "Add a Poll sticker: 'What distance do you zero a pistol red dot?' ('15 Yards' / '25 Yards') + Link to sikhrpa.org/zero-optics.html."}, {"id": "w2027-21", "badge": "W21", "tab": "y2027", "date": "Tue, May 25, 2027", "time": "12:00 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q2", "title": "Summer Break Is Coming: Double-Check Safe Storage Before Kids Are Home", "folder": "weekly-2027/week-21-summer-break-child-safety-check", "files": [{"path": "weekly-2027/week-21-summer-break-child-safety-check/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-21-summer-break-child-safety-check/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/", "sticker_text": "", "caption": "Summer Break Is Coming: Double-Check Safe Storage Before Kids Are Home\n\nਗਰਮੀਆਂ ਦੀਆਂ ਛੁੱਟੀਆਂ — ਬੱਚਿਆਂ ਦੀ ਸੁਰੱਖਿਆ ਲਈ ਹਰ ਹਥਿਆਰ ਤਾਲੇ ਵਿੱਚ ਰੱਖੋ\n\nWhen school lets out, kids and neighborhood friends spend far more unsupervised hours indoors. Lock every firearm and review the 4 Child Safety Rules.\n\n• 1. STOP (੧. ਰੁਕੋ): Teach children to freeze immediately if they ever encounter an unattended firearm.\n• 2. Don't Touch (੨. ਹੱਥ ਨਾ ਲਾਓ): Never touch it or let another friend pick it up.\n• 3. Leave Area (੩. ਦੂਰ ਹਟੋ): Walk away from the room or house right away.\n• 4. Tell an Adult (੪. ਵੱਡਿਆਂ ਨੂੰ ਦੱਸੋ): Report it to a parent or trusted adult immediately — and verify locks before playdates!\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #ChildSafety #SafeStorage #SummerSafety #PC25100 #FirearmSafetyEducation #SikhCommunity #StaySafeBeResponsible", "notes": "Share to Story so other parents screenshot the 4 Bilingual Child Safety Rules before summer break!"}, {"id": "w2027-22", "badge": "W22", "tab": "y2027", "date": "Tue, Jun 1, 2027", "time": "5:30 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q2", "title": "Summer Outdoor Shooting in California: Fire Restrictions & Backstops", "folder": "weekly-2027/week-22-california-outdoor-blm-fire-safety", "files": [{"path": "weekly-2027/week-22-california-outdoor-blm-fire-safety/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-22-california-outdoor-blm-fire-safety/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/trauma-safety.html", "sticker_text": "", "caption": "Summer Outdoor Shooting in California: Fire Restrictions & Backstops\n\nਗਰਮੀਆਂ ਵਿੱਚ ਆਊਟਡੋਰ ਰੇਂਜ ਸੁਰੱਖਿਆ — ਅੱਗ ਦੀਆਂ ਪਾਬੰਦੀਆਂ ਅਤੇ ਪੱਕੇ ਬੈਕਸਟਾਪ ਦੀ ਜਾਂਚ\n\nCalifornia enters peak wildfire season every June. Check BLM and National Forest fire orders BEFORE driving out, and pack a shovel, water, and extinguisher.\n\n• Verify BLM / USFS Fire Orders: Seasonal recreational shooting restrictions activate across CA counties every summer.\n• Never Shoot Steel in Dry Grass: Sparks from bi-metal jackets or steel targets can ignite dry brush in seconds.\n• Confirm Solid Earthen Berm: Never shoot toward skylines, rocky ridges (ricochets), or blind hiking trails.\n• Pack Out 100% of Trash & Brass: Leave California public lands cleaner than you found them.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/trauma-safety.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #RangeSafety #CaliforniaOutdoors #WildfireSafety #PublicSafetyEducation #FirearmSafetyEducation #StaySafeBeResponsible", "notes": "Share to Story before weekend outdoor range trips! Remind followers to check local BLM fire orders & save GPS coordinates."}, {"id": "w2027-23", "badge": "W23", "tab": "y2027", "date": "Tue, Jun 8, 2027", "time": "12:00 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q2", "title": "Why You Need a Mylar Space Blanket in Your Range IFAK — Even in Summer", "folder": "weekly-2027/week-23-hypothermia-lethal-triad-summer", "files": [{"path": "weekly-2027/week-23-hypothermia-lethal-triad-summer/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-23-hypothermia-lethal-triad-summer/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/trauma-safety.html", "sticker_text": "", "caption": "Why You Need a Mylar Space Blanket in Your Range IFAK — Even in Summer\n\nਗਰਮੀਆਂ ਵਿੱਚ ਵੀ ਖੂਨ ਵਹਿਣ ਕਾਰਨ ਸਰੀਰ ਠੰਢਾ ਪੈ ਜਾਂਦਾ ਹੈ — ਐਮਰਜੈਂਸੀ ਸ਼ੀਟ ਜ਼ਰੂਰ ਰੱਖੋ\n\nBlood loss destroys the body's ability to stay warm. Dropping just 2°F triggers the Trauma Lethal Triad and stops blood from clotting — even on a 95°F California afternoon.\n\n• 1. Hypothermia (<95°F Core): Massive bleeding chills a patient rapidly, even in hot summer air.\n• 2. Coagulopathy: Cold blood loses its chemical ability to form life-saving clots.\n• 3. Acidosis: Tissue shock lowers blood pH, accelerating life-threatening decline.\n• Action: Insulate & Wrap: Slide a mat/jacket under the patient off bare ground and wrap fully in a Mylar foil blanket.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/trauma-safety.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nMedical Disclaimer: Provided strictly for general safety awareness and does not constitute medical advice. Always dial 911 in an emergency and pursue hands-on training through ACS Stop the Bleed® or the Red Cross.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #StopTheBleed #FirstAidEducation #IFAK #RangeSafety #EmergencyPreparedness #StaySafeBeResponsible", "notes": "Add a Quiz sticker: 'Can a bleeding trauma patient develop hypothermia on a 95°F summer day?' (A: Yes — wrap in Mylar blanket! ✓ / B: No)"}, {"id": "w2027-24", "badge": "W24", "tab": "y2027", "date": "Wed, Jun 16, 2027", "time": "10:00 AM PDT", "format": "4:5 Feed Post + 9:16 Story • Q2", "title": "Shaheedi Diwas of Sri Guru Arjan Dev Ji & Birth of Miri-Piri (Yes)", "folder": "weekly-2027/week-24-guru-arjan-dev-shaheedi-guru-hargobind-parkash", "files": [{"path": "weekly-2027/week-24-guru-arjan-dev-shaheedi-guru-hargobind-parkash/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-24-guru-arjan-dev-shaheedi-guru-hargobind-parkash/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/heritage.html", "sticker_text": "", "caption": "Waheguru Ji Ka Khalsa, Waheguru Ji Ki Fateh!\n\nਸ਼ਹੀਦਾਂ ਦੇ ਸਿਰਤਾਜ ਸ੍ਰੀ ਗੁਰੂ ਅਰਜਨ ਦੇਵ ਜੀ ਦੀ ਲਾਸਾਨੀ ਸ਼ਹਾਦਤ ਨੂੰ ਕੋਟਿ-ਕੋਟਿ ਪ੍ਰਣਾਮ\n\nRemembering the supreme peaceful sacrifice of the Fifth Guru (1606) with humble Chhabeel Seva, alongside the Parkash Purab of Sri Guru Hargobind Sahib Ji (Jun 14), who established Miri-Piri.\n\n• Tera Kiya Meetha Lage: Guru Arjan Dev Ji endured unimaginable torture with serene spiritual composure and love for all.\n• Chhabeel & Cool Water Seva: Serving sweet cool water to neighbors honors Guru Ji's compassion during the summer heat.\n• Foundation of Miri-Piri (1606): Guru Hargobind Sahib Ji united spiritual grace (Piri) with the civic duty to shield the oppressed (Miri).\n\nLearn more about Sikh heritage, Miri-Piri, and our free bilingual safety resources at sikhrpa.org/heritage.html (Link in bio).\n\nਸਰਬੱਤ ਦਾ ਭਲਾ • ਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#GuruArjanDevJi #ShaheediDiwas #MiriPiri #Chhabeel #SikhHeritage #SikhRPA #SikhCommunity #StaySafeBeResponsible", "notes": "Share respectfully to your Story with minimal text + Link sticker to sikhrpa.org/heritage.html."}, {"id": "w2027-25", "badge": "W25", "tab": "y2027", "date": "Tue, Jun 22, 2027", "time": "5:30 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q2", "title": "California Law FAQ: Lawful Permanent Residents (Green Card Holders)", "folder": "weekly-2027/week-25-green-card-permanent-resident-faq", "files": [{"path": "weekly-2027/week-25-green-card-permanent-resident-faq/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-25-green-card-permanent-resident-faq/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/buyer-guide.html", "sticker_text": "", "caption": "California Law FAQ: Lawful Permanent Residents (Green Card Holders)\n\nਪੰਜਾਬੀ FAQ: ਗ੍ਰੀਨ ਕਾਰਡ ਧਾਰਕ ਕੈਲੀਫੋਰਨੀਆ ਵਿੱਚ ਕਾਨੂੰਨੀ ਦਸਤਾਵੇਜ਼ਾਂ ਬਾਰੇ ਕੀ ਜਾਣਨ?\n\nOne of the most common questions at our Gurdwara seminars: what documentation do Lawful Permanent Residents need under California and federal law?\n\n• Lawful Eligibility: Unexpired U.S. Permanent Resident Card (Form I-551) holders are legally eligible under federal & CA law.\n• Primary ID + Form I-551: Bring valid CA Driver's License/ID PLUS your physical unexpired Green Card (especially if 'Federal Limits Apply').\n• Handgun Proof of Residency: Current DMV vehicle registration, signed lease, or municipal utility bill matching your license address.\n• FSC & 10-Day Wait Apply Equally: Complete the 30-question CA FSC exam and exact 240-hour DROS waiting period.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/buyer-guide.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nEducational Disclaimer: Provided exclusively for 501(c)(3) public safety education — not legal advice. Always verify current statutes with the California DOJ Bureau of Firearms or consult a qualified California attorney.\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #CaliforniaCompliance #BilingualEducation #PunjabiCommunity #CaliforniaSikhs #PublicSafetyEducation #StaySafeBeResponsible", "notes": "Share to Story + Link sticker to sikhrpa.org/buyer-guide.html ('Share with family & new CA residents!')."}, {"id": "w2027-26", "badge": "W26", "tab": "y2027", "date": "Tue, Jun 29, 2027", "time": "12:00 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q2", "title": "Mid-Year 2027: How SikhRPA Keeps Safety Education 100% Free", "folder": "weekly-2027/week-26-midyear-501c3-impact-checkin", "files": [{"path": "weekly-2027/week-26-midyear-501c3-impact-checkin/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-26-midyear-501c3-impact-checkin/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/donate.html", "sticker_text": "", "caption": "Mid-Year 2027: How SikhRPA Keeps Safety Education 100% Free\n\n2027 ਅੱਧ-ਸਾਲ ਰਿਪੋਰਟ — ਮੁਫ਼ਤ ਪੰਜਾਬੀ ਗਾਈਡਾਂ, DOJ ਕੇਬਲ ਲਾਕ ਅਤੇ ਗੁਰਦੁਆਰਾ ਸੈਮੀਨਾਰ\n\nHalfway through 2027, every digital calculator, bilingual manual, and cable lock distributed by SikhRPA remains 100% free thanks to community Dasvandh & employer matches.\n\n• $20 = 1 Family Cable Lock: CA DOJ-approved locking device gifted free to young families & new owners.\n• $50 = 100 Bilingual Guides: Pocket English & Gurmukhi safety reference handbooks printed statewide.\n• Employer Corporate Match: Double your tax-deductible gift via Benevity / CyberGrants (EIN: 42-2595402).\n• 0% Fee Giving via Zelle: Tag: sikhrpa | Online portal: sikhrpa.org/donate.html.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org/donate.html (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #Nonprofit501c3 #PublicSafetyEducation #SafeStorage #Dasvandh #CaliforniaSikhs #StaySafeBeResponsible", "notes": "Add a Link sticker to sikhrpa.org/donate.html + thank supporters for backing free bilingual community clinics."}, {"id": "w2027-27", "badge": "W27", "tab": "y2027", "date": "Tue, Jul 6, 2027", "time": "5:30 PM PDT", "format": "4:5 Feed Post + 9:16 Story • Q3", "title": "First Time at a Public Range? Know These 5 Range Commands", "folder": "weekly-2027/week-27-cold-range-vs-hot-range-commands", "files": [{"path": "weekly-2027/week-27-cold-range-vs-hot-range-commands/post.png", "label": "4:5 Feed Post (post.png)"}, {"path": "weekly-2027/week-27-cold-range-vs-hot-range-commands/story.png", "label": "9:16 Companion Story (story.png)"}], "sticker_url": "https://sikhrpa.org/", "sticker_text": "", "caption": "First Time at a Public Range? Know These 5 Range Commands\n\nਪਹਿਲੀ ਵਾਰ ਸ਼ੂਟਿੰਗ ਰੇਂਜ 'ਤੇ ਜਾ ਰਹੇ ਹੋ? ਇਹ ੫ ਜ਼ਰੂਰੀ ਰੇਂਜ ਕਮਾਂਡਾਂ ਯਾਦ ਰੱਖੋ\n\nPublic shooting ranges run on strict Range Safety Officer (RSO) commands. Knowing them beforehand keeps you calm, respectful, and 100% safe.\n\n• 1. 'CEASE FIRE!': Stop immediately, finger off trigger, unload, lock action open, step behind the yellow/red line.\n• 2. 'RANGE IS COLD': ZERO handling of firearms on the bench while anyone is downrange changing targets.\n• 3. 'RANGE IS HOT': Eyes and ears ON before approaching the bench; safe firing may begin downrange.\n• 4. Case & Uncase at Firing Line Only: Never uncase behind the line — muzzle must point strictly downrange when opening any bag.\n\nExplore 100% free English & Gurmukhi safety tools anytime at sikhrpa.org (Link in bio).\nSikh Rifle and Pistol Association (SikhRPA) • California 501(c)(3) Nonprofit • EIN: 42-2595402 • president@sikhrpa.org\n\nਸੁਰੱਖਿਅਤ ਰਹੋ, ਜ਼ਿੰਮੇਵਾਰ ਬਣੋ! — Stay Safe, Be Responsible!\n\n#SikhRPA #RangeSafety #RangeEtiquette #FirearmSafetyEducation #BeginnerGuide #PublicSafetyEducation #StaySafeBeResponsible", "notes": "Add a Quiz sticker: 'During a COLD RANGE (people downrange), may you touch your unloaded firearm on the bench?' (A: Yes / B: NEVER! ✓)"}, {"id": "w2027-28", "badge": "W28", "tab": "y2027", "date": "Tue, Jul 13, 2027", "time": "12:00 PM
